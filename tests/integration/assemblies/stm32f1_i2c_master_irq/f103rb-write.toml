# Exact F103RB software harness. The bus has one cooperating controller.
schema = 2
board_package = "../stm32f1_buses/board"
backend = "baremetal"
clock = "hsi8"
optimization = "Os"

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 24576
static_ram_limit_bytes = 6144
libc_heap_bytes = 0

[i2c.i2c1]
binding = "i2c1"
mode = "irq-write-messages"
max_hz = 80000
irq = {priority = 0, calls_os = false}

[i2c_device.writer]
driver = "i2c-endpoint"
controller = "i2c1"
address = 80
address_bits = 7

[factory]
capabilities = true
