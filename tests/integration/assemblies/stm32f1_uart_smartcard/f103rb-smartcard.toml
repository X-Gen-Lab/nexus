schema = 2
board_package = "board"
backend = "baremetal"
clock = "hsi8"
optimization = "Os"

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
flash_load_limit_bytes = 16384
static_ram_limit_bytes = 4096

[uart.link]
binding = "smartcard-uart2"
mode = "irq-wire"
baud = 10753
rx = { format = "events", capacity = 32 }
irq = { priority = 5 }
wire = { protocol = "smartcard", prescaler = 1, guard_time = 2, smartcard_nack = true }

[factory]
capabilities = true
