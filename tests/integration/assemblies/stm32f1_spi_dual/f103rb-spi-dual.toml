# Two independent polling SPI masters on the NUCLEO-F103RB software reference.
schema = 2
board_package = "board"
backend = "baremetal"
clock = "hsi8"
optimization = "Os"

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 24576
static_ram_limit_bytes = 6144
libc_heap_bytes = 0

[spi.spi1]
binding = "spi1"
mode = "short-poll"
max_hz = 1000000

[spi_device.spi1_target]
driver = "spi-transaction"
controller = "spi1"
cs_binding = "spi1-cs"
mode = 0
max_hz = 1000000

[spi.spi2]
binding = "spi2"
mode = "short-poll"
max_hz = 1000000

[spi_device.spi2_target]
driver = "spi-transaction"
controller = "spi2"
cs_binding = "spi2-cs"
mode = 3
max_hz = 1000000

[factory]
capabilities = true
