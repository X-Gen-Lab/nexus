schema = 2
board_package = "board"
backend = "baremetal"
clock = "hsi8"
optimization = "Os"

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 24576
static_ram_limit_bytes = 6144
libc_heap_bytes = 0

[i2c_target.target]
binding = "i2c1-target"
mode = "target-rx-irq"
own_address = 82
address_bits = 7
second_address = 0
max_hz = 80000
irq_latency_us = 10
pec = false
alert = false
irq = {priority = 0, calls_os = false}

[factory]
capabilities = true
