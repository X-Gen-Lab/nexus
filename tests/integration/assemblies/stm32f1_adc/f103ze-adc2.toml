schema = 2
board_package = "ze-pair-board"
backend = "baremetal"
clock = "hsi8"
optimization = "Os"

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 24576
static_ram_limit_bytes = 6144
libc_heap_bytes = 0

[adc.analog]
binding = "analog2"
mode = "single-shot"
channels = [2]
sample_times = [5]
reference_mv = 3300
