schema = 2
board_package = "board"
backend = "baremetal"
clock = "hsi8"
optimization = "Os"

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 24576
static_ram_limit_bytes = 6144
libc_heap_bytes = 0

[block.media]
binding = "sd0"
mode = "sdio-poll"
protocol = "sd-memory"
speed = "default"
bus_width = 1
max_blocks = 1
poll_budget = 65535
stop_timeout_us = 1000000

[factory]
capabilities = true
