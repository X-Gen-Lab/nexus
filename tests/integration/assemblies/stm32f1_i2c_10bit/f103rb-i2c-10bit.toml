schema = 2
board_package = "board"
backend = "baremetal"
clock = "hsi8"
optimization = "Os"

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 24576
static_ram_limit_bytes = 6144
libc_heap_bytes = 0

[i2c.i2c1]
binding = "i2c1"
mode = "poll-messages"
max_hz = 80000

[i2c_device.short_address]
driver = "i2c-endpoint"
controller = "i2c1"
address = 73

[i2c_device.long_address]
driver = "i2c-endpoint"
controller = "i2c1"
address = 683
address_bits = 10
