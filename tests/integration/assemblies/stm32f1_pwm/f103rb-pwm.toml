schema = 2
board_package = "board"
backend = "baremetal"
clock = "hsi8"
optimization = "Os"

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 24576
static_ram_limit_bytes = 6144
libc_heap_bytes = 0

[pwm.waveform]
binding = "pwm0"
mode = "fixed-pwm"
tick_hz = 1000000
period_ticks = 1000
duty_ticks = 250

[factory]
capabilities = true
