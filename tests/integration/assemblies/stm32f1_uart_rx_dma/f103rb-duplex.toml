schema = 2
board_package = "duplex-board"
backend = "baremetal"
clock = "hsi8"
optimization = "Os"

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 24576
static_ram_limit_bytes = 6144
libc_heap_bytes = 0

[uart.duplex]
binding = "uart2_duplex"
mode = "dma-duplex"
baud = 115200

[uart.duplex.rx]
format = "blocks"

[uart.duplex.irq]
priority = 5
calls_os = false

[factory]
capabilities = true
