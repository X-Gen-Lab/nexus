schema = 2
board_package = "board"
backend = "baremetal"
clock = "hse8-mco-pll72"
optimization = "Os"
components = ["canopen"]

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 32768
static_ram_limit_bytes = 6144
libc_heap_bytes = 0

[hardware]
can_transceiver = "sn65hvd230dr-3v3-rs-pc2"

[can.bus]
binding = "can-bus"
mode = "classic-poll-normal"

[factory]
capabilities = true
