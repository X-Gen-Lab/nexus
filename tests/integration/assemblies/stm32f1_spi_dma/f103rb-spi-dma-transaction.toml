schema = 2
board_package = "board"
backend = "baremetal"
clock = "hsi8"
optimization = "Os"

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 24576
static_ram_limit_bytes = 6144
libc_heap_bytes = 0

[spi.spi2]
binding = "spi2"
mode = "dma"
max_hz = 1000000

[spi.spi2.irq]
priority = 5
calls_os = false

[spi_device.flash]
driver = "spi-dma-transaction"
controller = "spi2"
cs_binding = "spi2-cs"
mode = 0
max_hz = 1000000
