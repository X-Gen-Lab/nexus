schema = 2
board = "stm32f103rb_nucleo"
backend = "baremetal"
clock = "hsi8"
optimization = "Os"

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
flash_load_limit_bytes = 16384
static_ram_limit_bytes = 4096

[uart.external]
binding = "uart1"
mode = "irq"
baud = 57600
rx = { format = "bytes", capacity = 16 }
irq = { priority = 6 }

[uart.console]
binding = "uart2"
mode = "irq"
baud = 115200
rx = { format = "bytes", capacity = 16 }
irq = { priority = 5 }

[factory]
capabilities = true
