schema = 2
board_package = "three-leg-board"
backend = "baremetal"
clock = "hsi8"
optimization = "Os"

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 32768
static_ram_limit_bytes = 6144
libc_heap_bytes = 0

[pwm_adc.three]
binding = "cycle"
mode = "finite-injected"
exclusive = true
tick_hz = 8000000
period_ticks = 2048
trigger_ticks = 512
deadtime_ticks = 4
channels = [1]
sample_times = [3]
reference_mv = 3300

[pwm_adc.three.irq]
priority = 5
calls_os = false
