# Exact Cortex-M3 ThreadX software link experiment.
schema = 2
board_package = "f103rb-threadx-board"
backend = "threadx"
clock = "hsi8"
optimization = "Os"

[os]
tick_source = "systick"
tick_hz = 1000
interrupt_mask = "basepri"
syscall_priority = 5

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 49152
static_ram_limit_bytes = 14336
libc_heap_bytes = 0

[gpio.status]
binding = "led0"
mode = "output"
active_high = true
speed = "low"

[uart.console]
binding = "uart2"
mode = "irq"
baud = 115200

[uart.console.rx]
format = "bytes"
capacity = 32

[uart.console.irq]
priority = 5
calls_os = false

[factory]
capabilities = true
