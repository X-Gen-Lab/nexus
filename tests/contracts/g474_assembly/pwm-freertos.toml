schema = 2
board_package = "../../../boards/stm32g474re_hse24_reference"
backend = "freertos"
clock = "hse24-pll170"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 16384
flash_load_limit_bytes = 65536

[pwm.wave3]
binding = "pwm3"
mode = "fixed-pwm"
period_ticks = 1000
duty_ticks = 250
tick_hz = 1000000

[pwm.wave4]
binding = "pwm4"
mode = "fixed-pwm"
period_ticks = 1000
duty_ticks = 750
tick_hz = 1000000
