schema = 2
board_package = "../../../boards/stm32g474re_hse24_reference"
backend = "baremetal"
clock = "hse24-pll170"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 16384
flash_load_limit_bytes = 65536

[gpio.led]
binding = "led0"
mode = "output"

[gpio.bank_b]
binding = "gpio-b0"
mode = "output"

[gpio.bank_c]
binding = "gpio-c0"
mode = "input"

[uart.usart1]
binding = "usart1"
mode = "irq-bytes"
baud = 115200
[uart.usart1.rx]
format = "bytes"
capacity = 32
[uart.usart1.irq]
priority = 5
calls_os = false

[uart.usart2]
binding = "usart2"
mode = "irq-bytes"
baud = 115200
[uart.usart2.rx]
format = "bytes"
capacity = 32
[uart.usart2.irq]
priority = 5
calls_os = false

[uart.usart3]
binding = "usart3"
mode = "irq-bytes"
baud = 115200
[uart.usart3.rx]
format = "bytes"
capacity = 32
[uart.usart3.irq]
priority = 5
calls_os = false

[uart.uart4]
binding = "uart4"
mode = "irq-bytes"
baud = 115200
[uart.uart4.rx]
format = "bytes"
capacity = 32
[uart.uart4.irq]
priority = 5
calls_os = false

[uart.uart5]
binding = "uart5"
mode = "irq-bytes"
baud = 115200
[uart.uart5.rx]
format = "bytes"
capacity = 32
[uart.uart5.irq]
priority = 5
calls_os = false
