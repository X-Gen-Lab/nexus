schema = 2
board_package = "../../../boards/stm32g474re_hse24_reference"
backend = "baremetal"
clock = "hse24-pll170"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 16384
flash_load_limit_bytes = 65536

[spi.bus1]
binding = "spi1"
mode = "short-poll"
max_hz = 1000000

[spi_device.device1]
controller = "bus1"
driver = "spi-endpoint"
cs_binding = "spi1-cs"
mode = 0
max_hz = 1000000

[spi.bus2]
binding = "spi2"
mode = "short-poll"
max_hz = 1000000

[spi_device.device2]
controller = "bus2"
driver = "spi-endpoint"
cs_binding = "spi2-cs"
mode = 1
max_hz = 1000000

[watchdog.watchdog0]
binding = "watchdog0"
mode = "independent"
