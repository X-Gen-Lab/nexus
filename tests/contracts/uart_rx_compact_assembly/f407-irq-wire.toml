# Exact software resource fixture; physical HIL is not implied.
schema = 2
board_package = "wire-board"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 65536
static_ram_limit_bytes = 32768
libc_heap_bytes = 0

[uart.uart1]
binding = "uart1"
mode = "irq-wire"
baud = 115200

[uart.uart1.rx]
format = "bytes"
capacity = 32

[uart.uart1.irq]
priority = 5

[factory]
capabilities = true

[uart.uart1.wire]
protocol = "synchronous"
clock_polarity = true
clock_phase = true
last_bit_clock = true
