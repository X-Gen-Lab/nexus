# Exact UART-only software fixture; no physical route qualification is implied.
schema = 2
board_package = "../stm32_assembly/zg_board"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 65536
static_ram_limit_bytes = 32768
libc_heap_bytes = 0

[uart.uart1]
binding = "uart1"
mode = "irq-blocks"
baud = 115200

[uart.uart1.rx]
format = "blocks"

[uart.uart1.irq]
priority = 5
