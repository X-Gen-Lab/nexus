# Alternate silicon resource fixture; no PCB or physical qualification.
schema = 2
board_package = "alternate-board"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 65536
static_ram_limit_bytes = 32768
libc_heap_bytes = 0

[spi.bus]
binding = "spi1"
mode = "dma"
max_hz = 1000000
[spi.bus.irq]
priority = 5
[spi_device.sensor]
controller = "bus"
cs_binding = "cs0"
mode = 0
max_hz = 1000000
