# Alternate silicon resource fixture; no PCB or physical qualification.
schema = 2
board_package = "alternate-board"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 65536
static_ram_limit_bytes = 32768
libc_heap_bytes = 0

[uart.serial6]
binding = "serial6"
mode = "dma-duplex"
baud = 115200
[uart.serial6.rx]
format = "blocks"
[uart.serial6.irq]
priority = 5
