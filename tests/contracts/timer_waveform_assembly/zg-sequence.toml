schema=2
board_package="zg-sequence"
backend="baremetal"
clock="hse8-pll168"
[memory]
main_stack_bytes=2048
libc_heap_bytes=0

[timer_sequence.drive]
binding="drive"
mode="dma-burst"
tick_hz=1000000
period_ticks=1000
deadtime_ticks=0
exclusive=true
poll_limit=128
break_active_high=true
idle_high=false
idle_complement_high=false
irq={priority=5,calls_os=false}
burst_budget_hclk_cycles=500
