schema=2
board_package="ve-pulse"
backend="baremetal"
clock="hse8-pll168"
[memory]
main_stack_bytes=2048
libc_heap_bytes=0

[timer_pulse.drive]
binding="drive"
mode="one-pulse"
tick_hz=1000000
period_ticks=1000
deadtime_ticks=0
exclusive=true
poll_limit=128
break_active_high=true
idle_high=false
idle_complement_high=false
irq={priority=5,calls_os=false}
