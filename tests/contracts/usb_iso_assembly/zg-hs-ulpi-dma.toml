# Software-only ISO transport reference; no PCB or host qualification.
schema=2
board_package="../usb_device_hs_assembly/stm32-zg-ulpi-board"
backend="baremetal"
clock="hse8-pll168"
[factory]
capabilities=true
[memory]
main_stack_bytes=2048
libc_heap_bytes=0
static_ram_limit_bytes=16384
flash_load_limit_bytes=65536
[usb_device.fs]
binding="usbhs"
mode="device-hs-ulpi"
event_capacity=8
rx_fifo_words=288
vbus_sensing=false
electrical_handover="external-owner"
ulpi_clock_hz=60000000
poll_limit=128
drain_timeout_us=1000
clock_timeout_us=5000
engine="dma"
irq={priority=5,calls_os=false}
[usb_endpoint.control_in]
controller="fs"
number=0
direction="in"
transfer="control"
max_packet=64
fifo_words=16
[usb_endpoint.control_out]
controller="fs"
number=0
direction="out"
transfer="control"
max_packet=64
[usb_endpoint.data_in]
controller="fs"
number=1
direction="in"
transfer="isochronous"
max_packet=1024
fifo_words=256
[usb_endpoint.data_out]
controller="fs"
number=1
direction="out"
transfer="isochronous"
max_packet=1024
