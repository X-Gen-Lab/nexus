# Software-only 2 MHz APB2/1-bit socket; no card or timing qualification.
schema=2
board_package="../../../boards/stm32f407zg_qiming_v41"
backend="baremetal"
clock="custom"
optimization="Os"
[hardware]
sd_card="inserted"
[clock_parameters]
source="hse"
input_hz=8000000
pll_m=8
pll_n=192
pll_p=2
pll_q=4
ahb_div=4
apb1_div=1
apb2_div=1
adc_div=4
supply_mv=3300
css=false
sysclk_source="input"
pll48=true
[memory]
main_stack_bytes=2048
libc_heap_bytes=0
static_ram_limit_bytes=16384
flash_load_limit_bytes=65536
[block.sd0]
binding="sdio"
mode="sdio-poll"
bus_width=1
max_blocks=2
poll_budget=50000
stop_timeout_us=10000
