schema = 2
board_package = "zg_board"
backend = "freertos"
clock = "custom"
optimization = "Os"

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 32768
flash_load_limit_bytes = 65536

[exti.edge0]
binding = "edge0"
mode = "hardware-event"
edge = "both"

