schema = 2
board_package = "ve_board"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 32768
flash_load_limit_bytes = 65536

[exti.edge0]
binding = "edge0"
mode = "edge-event"
edge = "both"
event_capacity = 2
irq.priority = 5
irq.calls_os = false

