# All six small timers; software reference, no physical sensor qualification.
schema=2
board_package="zg-board"
backend="freertos"
clock="hse8-pll168"
optimization="Os"
[memory]
main_stack_bytes=2048
libc_heap_bytes=0
static_ram_limit_bytes=32768
flash_load_limit_bytes=98304
[timer_capture.edge9]
binding="capture9"
mode="edge-capture"
