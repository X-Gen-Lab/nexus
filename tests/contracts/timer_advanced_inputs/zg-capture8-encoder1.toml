# Software-only capture/encoder assembly, no physical qualification.
schema=2
board_package="zg-board"
backend="freertos"
clock="hse8-pll168"
optimization="Os"
[memory]
main_stack_bytes=2048
libc_heap_bytes=0
static_ram_limit_bytes=32768
flash_load_limit_bytes=98304
[timer_capture.edge]
binding="capture8"
mode="edge-capture"
tick_hz=1000000
edge="both"
filter=3
exclusive=true
[timer_capture.edge.irq]
priority=5
calls_os=false
[encoder.position]
binding="position1"
mode="quadrature"
counting="x4"
filter_a=3
filter_b=7
invert_a=false
invert_b=true
exclusive=true
