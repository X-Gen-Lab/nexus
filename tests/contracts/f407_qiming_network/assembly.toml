# Reviewed Qiming source wiring, explicitly software-only Board admission.
schema = 2
board_package = "board"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 8192
flash_load_limit_bytes = 524288
static_ram_limit_bytes = 122880
libc_heap_bytes = 0

[eth_frames.mac]
binding = "rmii"
mode = "rmii-vlan-sg-ptp"
tx_count = 2
rx_count = 2
rx_storage_bytes = 1536
address = [2, 0, 0, 0, 0, 2]
init_timeout_us = 5000
drain_timeout_us = 1000

[eth_frames.mac.irq]
priority = 5
calls_os = false
