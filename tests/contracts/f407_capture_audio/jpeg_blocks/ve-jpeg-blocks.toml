schema = 2
board_package = "../ve_board"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 32768
flash_load_limit_bytes = 65536

[capture.camera]
binding = "camera-jpeg"
mode = "jpeg-blocks"
pixel_clock_hz = 24000000
max_service_gap_us = 10
poll_limit = 128
frame_divisor = 1
pclk_falling = false
hsync_high = false
vsync_high = false
irq = { priority = 5 }
