schema = 2
board_package = "ve_board"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 32768
flash_load_limit_bytes = 65536

[audio.sound]
binding = "sound"
mode = "slave-duplex-blocks"
standard = "philips"
sample_bits = 24
slot_bits = 32
mclk = false
cpol_high = false
poll_limit = 4096
irq = { priority = 5 }
max_sample_rate_hz = 96000
max_service_gap_us = 20
