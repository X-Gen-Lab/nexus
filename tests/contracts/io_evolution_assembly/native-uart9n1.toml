# Software contract fixture; no physical qualification is implied.
schema = 2
board = "native_reference"
backend = "native"
clock = "model"
optimization = "Os"

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 65536
static_ram_limit_bytes = 32768
libc_heap_bytes = 0

[uart.uart0]
binding = "uart0"
mode = "irq-words"
baud = 115200

[uart.uart0.rx]
format = "words"
capacity = 32

[uart.uart0.irq]
priority = 5

[factory]
capabilities = true

[uart.uart0.frame]
data_bits = 9
parity = "none"
stop_bits = 1
flow = "none"
