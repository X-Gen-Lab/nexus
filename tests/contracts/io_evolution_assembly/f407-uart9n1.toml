# Software contract fixture; no physical qualification is implied.
schema = 2
board = "stm32f407_qiming_v31"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 65536
static_ram_limit_bytes = 32768
libc_heap_bytes = 0

[uart.uart1]
binding = "uart1"
mode = "irq-words"
baud = 115200

[uart.uart1.rx]
format = "words"
capacity = 32

[uart.uart1.irq]
priority = 5

[factory]
capabilities = true

[uart.uart1.frame]
data_bits = 9
parity = "none"
stop_bits = 1
flow = "none"
