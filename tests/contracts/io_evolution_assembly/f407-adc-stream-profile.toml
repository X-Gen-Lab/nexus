schema = 2
board_package = "../stm32_assembly/zg_board"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0

[adc.samples]
binding = "adc_scan"
mode = "trigger-dma-continuous"
channels = [0, 1]
sample_times = [0, 7]
reference_mv = 3300

[adc.samples.irq]
priority = 5
calls_os = false

# Authored software envelope; clocks, target hold and wires are not measured.
[adc.samples.stream]
max_units_per_second = 1000
units_per_block = 100
blocks = 8
release_delay_us = 500000
target_delay_us = 99999
on_exhaustion = "stop-and-report-gap"
source = "declared software test envelope; not measured"
