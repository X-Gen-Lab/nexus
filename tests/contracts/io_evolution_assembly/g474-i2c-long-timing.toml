# Software contract fixture; no physical qualification is implied.
schema = 2
board_package = "../g474_assembly/acquisition_board"
backend = "baremetal"
clock = "hse24-pll170"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 16384
flash_load_limit_bytes = 65536

[adc.sensor]
binding = "sensor"
mode = "single-shot"
channels = [1]
sample_times = [0]
reference_mv = 3300

[i2c.bus]
binding = "bus"
mode = "poll-messages"
max_hz = 100000

[i2c_device.sensor_registers]
driver = "i2c-long-endpoint"
controller = "bus"
address = 80

[flash.physical]
binding = "physical"
mode = "poll-word"

# Explicit calculation envelope for software testing.
# Validate physical clock and electrical bounds before HIL.
[i2c.bus.timing]
kernel_hz_min = 15000000
kernel_hz_max = 17000000
pclk_hz_min = 160000000
bus_hz_min = 60000
rise_ns_max = 1000
fall_ns_max = 300
source = "software contract declared envelope; not measured"
