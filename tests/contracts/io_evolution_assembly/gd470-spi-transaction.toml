# Software contract fixture; no physical qualification is implied.
schema = 2
board_package = "../gd32_assembly/software_board"
backend = "baremetal"
clock = "hxtal25-pll200"
optimization = "Os"

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 65536
static_ram_limit_bytes = 16384
libc_heap_bytes = 0

[spi.spi0]
binding = "spi0"
mode = "short-poll"
max_hz = 1000000

[spi_device.device0]
driver = "spi-transaction"
controller = "spi0"
mode = 0
max_hz = 1000000

[factory]
capabilities = true
