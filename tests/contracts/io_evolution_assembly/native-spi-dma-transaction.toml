# Software host model; no physical IRQ, DMA or electrical qualification.
schema = 2
board_package = "../native_assembly/multi_board"
backend = "native"
clock = "model"
components = ["spi-dma-owner"]

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0

[spi.bus]
binding = "spi0"
mode = "async-model"
max_hz = 1000000

[spi.other_bus]
binding = "spi1"
mode = "async-model"
max_hz = 1000000

[spi_device.device_a]
controller = "bus"
driver = "spi-dma-transaction"

[spi_device.device_b]
controller = "bus"
driver = "spi-dma-transaction"

[spi_device.other_device]
controller = "other_bus"
driver = "spi-dma-transaction"
