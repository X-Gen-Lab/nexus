schema = 2
board_package = "../../../boards/stm32u575_nucleo_zi_q"
backend = "baremetal"
clock = "msis4"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 16384
flash_load_limit_bytes = 65536

[gpio.led]
binding = "led0"
mode = "output"

[uart.console]
binding = "uart1"
mode = "irq-bytes"
baud = 115200
[uart.console.rx]
format = "bytes"
capacity = 64
[uart.console.irq]
priority = 5
calls_os = false
