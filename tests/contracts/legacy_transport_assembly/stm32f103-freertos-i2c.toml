schema = 2
board = "stm32f103_reference"
backend = "freertos"
clock = "hsi8-fixed"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 16384
flash_load_limit_bytes = 65536

[i2c.bus]
binding = "i2c0"
mode = "irq-messages"
max_hz = 80000

[i2c.bus.irq]
priority = 0
calls_os = false

[i2c_device.sensor]
controller = "bus"
driver = "i2c-endpoint"
address = 80
