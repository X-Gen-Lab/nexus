schema = 2
board_package = "ve_board"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 65536
static_ram_limit_bytes = 16384
libc_heap_bytes = 0

[adc.adc0]
binding = "adc_scan"
mode = "low-rate-scan"
channels = [0, 1]
sample_times = [7, 7]
reference_mv = 3300
