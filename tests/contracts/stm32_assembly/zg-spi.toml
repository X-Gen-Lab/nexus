schema = 2
board_package = "zg_board"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 65536
static_ram_limit_bytes = 16384
libc_heap_bytes = 0

[spi.spi0]
binding = "spi0"
mode = "short-poll"
max_hz = 1000000

[spi_device.sensor0]
controller = "spi0"
driver = "spi-endpoint"
cs_binding = "cs0"
mode = 0
max_hz = 1000000
