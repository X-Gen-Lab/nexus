schema = 2
board = "stm32f103_reference"
backend = "freertos"
clock = "hsi8-fixed"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 8192
flash_load_limit_bytes = 32768

[adc.input]
binding = "adc0"
mode = "single-shot"
channels = [0]
sample_times = [7]
reference_mv = 3300

[pwm.output]
binding = "pwm0"
mode = "fixed-pwm"
period_ticks = 1000
duty_ticks = 100
tick_hz = 1000000

[flash.physical]
binding = "flash0"
mode = "poll-word"
