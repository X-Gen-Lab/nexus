schema = 2
board = "stm32f103_reference"
backend = "freertos"
clock = "hsi8-fixed"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 8192
flash_load_limit_bytes = 32768

[spi.bus]
binding = "spi1"
mode = "short-poll"
max_hz = 1000000

[spi_device.peripheral]
controller = "bus"
driver = "spi-endpoint"
cs_binding = "spi1-cs"
mode = 0
max_hz = 1000000
