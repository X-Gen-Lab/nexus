# Software-only timer clock reference, reusing the reviewed silicon-pad fixture.
schema=2
board_package="../timer_assembly/stm32-zg-board"
backend="baremetal"
clock="custom"
optimization="Os"
[clock_parameters]
source="hsi"
input_hz=16000000
pll_m=16
pll_n=336
pll_p=4
pll_q=7
ahb_div=1
apb1_div=4
apb2_div=2
adc_div=4
supply_mv=3300
css=false
[memory]
main_stack_bytes=2048
libc_heap_bytes=0
static_ram_limit_bytes=16384
flash_load_limit_bytes=65536
[timer_capture.edge]
binding="capture"
mode="edge-capture"
tick_hz=1000000
edge="both"
filter=3
exclusive=true
[timer_capture.edge.irq]
priority=5
calls_os=false
[advanced_pwm.power]
binding="complementary"
mode="complementary-pwm"
tick_hz=1000000
period_ticks=1000
deadtime_ticks=128
break_active_high=true
idle_high=false
idle_complement_high=false
exclusive=true
[advanced_pwm.power.irq]
priority=5
calls_os=false
