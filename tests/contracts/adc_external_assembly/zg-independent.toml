schema = 2
board_package = "zg_board"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 65536
static_ram_limit_bytes = 16384
libc_heap_bytes = 0

[adc.a]
binding = "independent1"
mode = "single-shot"
channels = [4]
sample_times = [7]
reference_mv = 3300
resolution_bits = 12

[adc.b]
binding = "independent2"
mode = "single-shot"
channels = [8]
sample_times = [7]
reference_mv = 3300
resolution_bits = 10

[adc.c]
binding = "independent3"
mode = "single-shot"
channels = [4]
sample_times = [7]
reference_mv = 3300
resolution_bits = 6
