board_package = "capture_board"
schema = 2
backend = "baremetal"
clock = "hse24-pll170"
optimization = "Os"

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0

[timer_capture.capture]
binding = "capture"
mode = "edge-capture"
tick_hz = 1000000
edge = "rising"
filter = 0
exclusive = true

[timer_capture.capture.irq]
priority = 5
calls_os = false
