schema = 2
board_package = "board"
backend = "baremetal"
clock = "hse24-pll170"
optimization = "Os"

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0

[pwm_group.wave]
binding = "wave"
mode = "coherent-pwm"
tick_hz = 1000000
period_ticks = 1000
deadtime_ticks = 170
exclusive = true

[pwm_group.wave.irq]
priority = 5
calls_os = false
