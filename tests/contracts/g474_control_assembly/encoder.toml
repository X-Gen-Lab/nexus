board_package = "encoder_board"
schema = 2
backend = "baremetal"
clock = "hse24-pll170"
optimization = "Os"

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0

[encoder.position]
binding = "position"
mode = "quadrature"
counting = "x4-ti12"
filter_a = 0
filter_b = 0
invert_a = false
invert_b = false
exclusive = true
