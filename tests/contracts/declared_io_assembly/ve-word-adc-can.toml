# Software-only exact-part selection; no physical qualification is implied.
schema = 2
board_package = "software-boards/ve"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 32768
flash_load_limit_bytes = 65536

[uart.link]
binding = "uart1"
mode = "irq-words"
baud = 115200

[uart.link.rx]
format = "words"
capacity = 32

[uart.link.irq]
priority = 5
calls_os = false

[uart.link.frame]
data_bits = 9
parity = "none"
stop_bits = 1
flow = "none"

[adc.samples]
binding = "adc_scan"
mode = "trigger-dma-continuous"
channels = [0, 1]
sample_times = [0, 7]
reference_mv = 3300

[adc.samples.irq]
priority = 5
calls_os = false

[can_domain]
split = 14

[[can_domain.filters]]
controller = "bus0"
bank = 0
id = 291
mask = 2047
format = "standard"
fifo = 0
remote = false
match_remote = true

[[can_domain.filters]]
controller = "bus1"
bank = 14
id = 801
mask = 2047
format = "standard"
fifo = 1
remote = false
match_remote = true

[can.bus0]
binding = "can1"
mode = "classic-irq"
operation = "loopback"
event_capacity = 8
bitrate = 500000
drain_timeout_us = 1000
poll_limit = 128
fifo_order = true
timing = {prescaler = 6, segment1 = 11, segment2 = 2, sjw = 2}

[can.bus0.irq]
priority = 5
calls_os = false

[can.bus1]
binding = "can2"
mode = "classic-irq"
operation = "loopback"
event_capacity = 8
bitrate = 500000
drain_timeout_us = 1000
poll_limit = 128
fifo_order = true
timing = {prescaler = 6, segment1 = 11, segment2 = 2, sjw = 2}

[can.bus1.irq]
priority = 5
calls_os = false
