schema = 2
board_package = "software-boards/g474-output"
backend = "baremetal"
clock = "hse24-pll170"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 32768
flash_load_limit_bytes = 65536

[gpio.d_output]
binding = "d_output"
mode = "output"
