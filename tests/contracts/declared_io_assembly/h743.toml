schema = 2
board_package = "software-boards/h743"
backend = "baremetal"
clock = "hsi64-fixed-cache-off"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 32768
flash_load_limit_bytes = 65536

[exti.edge1]
binding = "edge1"
mode = "edge-event"
edge = "both"
event_capacity = 4
[exti.edge1.irq]
priority = 5
calls_os = false

[gpio.b_input]
binding = "b_input"
mode = "input"

[gpio.e_output]
binding = "e_output"
mode = "output"
