schema = 2
board_package = "software-boards/f407-output"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 32768
flash_load_limit_bytes = 65536


[gpio.a_output]
binding = "a_output"
mode = "output"

[gpio.b_output]
binding = "b_output"
mode = "output"
