schema = 2
board_package = "software-boards/u575"
backend = "baremetal"
clock = "msis4"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 32768
flash_load_limit_bytes = 65536

[exti.edge0]
binding = "edge0"
mode = "edge-event"
edge = "both"
event_capacity = 4
[exti.edge0.irq]
priority = 5
calls_os = false

[gpio.a_output]
binding = "a_output"
mode = "output"

[gpio.b_output]
binding = "b_output"
mode = "output"

[gpio.d_output]
binding = "d_output"
mode = "output"

[gpio.e_output]
binding = "e_output"
mode = "output"

[gpio.f_output]
binding = "f_output"
mode = "output"

[gpio.g_output]
binding = "g_output"
mode = "output"

[gpio.h_output]
binding = "h_output"
mode = "output"
