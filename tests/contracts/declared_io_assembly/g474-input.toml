schema = 2
board_package = "software-boards/g474-input"
backend = "baremetal"
clock = "hse24-pll170"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 32768
flash_load_limit_bytes = 65536

[gpio.a_input]
binding = "a_input"
mode = "input"

[gpio.b_input]
binding = "b_input"
mode = "input"

[gpio.c_output]
binding = "c_output"
mode = "output"

[gpio.d_input]
binding = "d_input"
mode = "input"
