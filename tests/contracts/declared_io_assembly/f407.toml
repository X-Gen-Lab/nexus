schema = 2
board_package = "software-boards/f407"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 32768
flash_load_limit_bytes = 65536

[exti.edge0]
binding = "edge0"
mode = "edge-event"
edge = "both"
event_capacity = 4
[exti.edge0.irq]
priority = 5
calls_os = false

[gpio.g_output]
binding = "g_output"
mode = "output"

[gpio.b_input]
binding = "b_input"
mode = "input"

[gpio.e_input]
binding = "e_input"
mode = "input"
