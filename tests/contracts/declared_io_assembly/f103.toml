schema = 2
board_package = "software-boards/f103"
backend = "baremetal"
clock = "hsi8-fixed"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 16384
flash_load_limit_bytes = 65536

[gpio.a_input]
binding = "a_input"
mode = "input"
