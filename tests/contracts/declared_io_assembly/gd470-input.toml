schema = 2
board_package = "software-boards/gd470-input"
backend = "baremetal"
clock = "hxtal25-pll200"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 32768
flash_load_limit_bytes = 65536


[gpio.b_input]
binding = "b_input"
mode = "input"
