schema = 2
board_package = "software-boards/gd303"
backend = "baremetal"
clock = "irc8"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 32768
flash_load_limit_bytes = 65536

[exti.edge0]
binding = "edge0"
mode = "edge-event"
edge = "both"
event_capacity = 4
[exti.edge0.irq]
priority = 0
calls_os = false

[gpio.a_input]
binding = "a_input"
mode = "input"
