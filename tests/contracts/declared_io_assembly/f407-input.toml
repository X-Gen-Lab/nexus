schema = 2
board_package = "software-boards/f407-input"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 32768
flash_load_limit_bytes = 65536


[gpio.a_input]
binding = "a_input"
mode = "input"

[gpio.g_input]
binding = "g_input"
mode = "input"
