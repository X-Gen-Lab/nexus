# Software-only exact-part selection; no physical qualification is implied.
schema = 2
board_package = "software-boards/ve"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 32768
flash_load_limit_bytes = 65536

[uart.link]
binding = "uart1"
mode = "rx-dma-idle"
baud = 115200

[uart.link.rx]
format = "blocks"

[uart.link.irq]
priority = 5
calls_os = false

[exti.edge0]
binding = "edge0"
mode = "edge-event"
edge = "both"
event_capacity = 4

[exti.edge0.irq]
priority = 5
calls_os = false

[gpio.b]
binding = "b"
mode = "input"

[gpio.e]
binding = "e"
mode = "input"
