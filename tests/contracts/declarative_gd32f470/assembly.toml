schema=2
soc_package="."
board_package="board"
backend="baremetal"
clock="irc16"
optimization="Os"
[memory]
main_stack_bytes=2048
libc_heap_bytes=0
flash_load_limit_bytes=65536
static_ram_limit_bytes=16384
[gpio.status]
binding="status"
mode="output"
[uart.console]
binding="console"
mode="irq-byte-event"
baud=115200
[uart.console.rx]
format="events"
capacity=4
[uart.console.irq]
priority=5
calls_os=false
