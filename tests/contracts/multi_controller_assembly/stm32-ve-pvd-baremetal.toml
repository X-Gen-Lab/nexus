# Software reference only: PLS code is explicit, not a precise voltage promise.
schema = 2
board_package = "stm32-ve-board"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 16384
flash_load_limit_bytes = 65536

[exti.supply]
binding = "pvd"
mode = "pvd-level"
threshold_code = 5
