# Three-controller timing fixture; no physical Board qualification.
schema = 2
board_package = "stm32-zg-board"
backend = "freertos"
clock = "hse8-pll168"
optimization = "Os"

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 16384
flash_load_limit_bytes = 65536

[i2c.bus1]
binding = "primary-i2c"
mode = "irq-messages"
max_hz = 400000
[i2c.bus1.irq]
priority = 5
calls_os = false

[i2c_device.sensor1]
controller = "bus1"
address = 80

[i2c.bus2]
binding = "secondary-i2c"
mode = "irq-messages"
max_hz = 400000
[i2c.bus2.irq]
priority = 5
calls_os = false

[i2c_device.sensor2]
controller = "bus2"
address = 80

[i2c.bus3]
binding = "i2c3"
mode = "dma-messages"
max_hz = 400000
[i2c.bus3.irq]
priority = 5
calls_os = false

[i2c_device.sensor3]
controller = "bus3"
address = 80
