schema = 2
board_package = "stm32-zg-board"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 16384
flash_load_limit_bytes = 65536

[spi.third_spi]
binding = "spi3"
mode = "short-poll"
max_hz = 1000000

[spi_device.sensor_spi]
controller = "third_spi"
mode = 0
max_hz = 1000000
cs_binding = "primary-cs"

[i2c.third_i2c]
binding = "i2c3"
mode = "poll-messages"
max_hz = 100000

[i2c_device.sensor_i2c]
controller = "third_i2c"
address = 80

[adc.analog]
binding = "adc3"
mode = "trigger-dma-continuous"
channels = [4]
sample_times = [7]
reference_mv = 3300
[adc.analog.irq]
priority = 5
calls_os = false
