schema = 2
board_package = "stm32-ve-board"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 16384
flash_load_limit_bytes = 65536

[uart.serial1]
binding = "primary-uart"
mode = "irq-words"
baud = 115200
[uart.serial1.rx]
format = "words"
capacity = 4
[uart.serial1.frame]
data_bits = 9
parity = "none"
stop_bits = 1
flow = "none"
[uart.serial1.irq]
priority = 5
calls_os = false

