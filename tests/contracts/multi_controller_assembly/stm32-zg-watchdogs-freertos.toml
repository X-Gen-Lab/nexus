# Two distinct watchdog identities; normal preparation never activates them.
schema = 2
board_package = "stm32-zg-board"
backend = "freertos"
clock = "hse8-pll168"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 16384
flash_load_limit_bytes = 65536

[watchdog.independent]
binding = "iwdg"
mode = "independent"

[watchdog.window]
binding = "wwdg"
mode = "window"
window_ticks = 62
