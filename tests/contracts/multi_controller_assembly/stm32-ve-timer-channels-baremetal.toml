# Silicon-only channel contracts; no PCB connections or waveforms qualified.
schema = 2
board_package = "stm32-ve-board"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 16384
flash_load_limit_bytes = 65536

[timer_capture.tim3]
binding = "timer-capture-tim3-ch3-pb0"
mode = "edge-capture"
tick_hz = 1000000
exclusive = true
edge = "both"
filter = 3

[timer_capture.tim3.irq]
priority = 6
calls_os = false

[timer_capture.tim4]
binding = "timer-capture-tim4-ch2-pb7"
mode = "edge-capture"
tick_hz = 1000000
exclusive = true
edge = "both"
filter = 3

[timer_capture.tim4.irq]
priority = 6
calls_os = false

[timer_capture.tim5]
binding = "timer-capture-tim5-ch4-pa3"
mode = "edge-capture"
tick_hz = 1000000
exclusive = true
edge = "both"
filter = 3

[timer_capture.tim5.irq]
priority = 6
calls_os = false

[advanced_pwm.tim1]
binding = "timer-complementary-tim1-ch3-pa10-pb15-pb12"
mode = "complementary-pwm"
tick_hz = 1000000
exclusive = true
period_ticks = 1000
deadtime_ticks = 128
break_active_high = true
idle_high = false
idle_complement_high = false

[advanced_pwm.tim1.irq]
priority = 6
calls_os = false

[advanced_pwm.tim8]
binding = "timer-complementary-pc6-pa7-pa6"
mode = "complementary-pwm"
tick_hz = 1000000
exclusive = true
period_ticks = 1000
deadtime_ticks = 128
break_active_high = true
idle_high = false
idle_complement_high = false

[advanced_pwm.tim8.irq]
priority = 6
calls_os = false
