# Software-only SPI silicon pad reference; HIL has not been executed.
schema=2
board_package="ve-board"
backend="baremetal"
clock="hse8-pll168"
optimization="Os"
[factory]
capabilities=true
[memory]
main_stack_bytes=2048
libc_heap_bytes=0
flash_load_limit_bytes=65536
static_ram_limit_bytes=32768

[spi.wire1]
binding="wire1"
mode="irq-frames"
max_hz=500000
[spi.wire1.irq]
priority=5
calls_os=false
[spi.wire1.frames]
role="master"
lines="two-line"
format="motorola"
word_bits=16
irq_latency_us=2
crc_polynomial=4129

[spi.wire2]
binding="wire2"
mode="irq-frames"
max_hz=500000
[spi.wire2.irq]
priority=5
calls_os=false
[spi.wire2.frames]
role="slave"
lines="one-wire"
format="ti"
word_bits=16
irq_latency_us=2
crc_polynomial=0

[spi.wire3]
binding="wire3"
mode="irq-frames"
max_hz=500000
[spi.wire3.irq]
priority=5
calls_os=false
[spi.wire3.frames]
role="master"
lines="receive-only"
format="motorola"
word_bits=16
irq_latency_us=2
crc_polynomial=7
