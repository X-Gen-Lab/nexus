schema = 2
board = "stm32f407zg_qiming_v41"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[hardware]
sd_card = "inserted"

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 65536
static_ram_limit_bytes = 32768
libc_heap_bytes = 0

[uart.console]
binding = "uart1"
mode = "irq-byte-event"
baud = 115200

[uart.console.rx]
format = "bytes"
capacity = 16

[uart.console.irq]
priority = 5

[block.sd0]
binding = "sdio"
mode = "sdio-poll"
bus_width = 4
max_blocks = 32
poll_budget = 50000
stop_timeout_us = 10000
