schema=2
board_package="boards/zg-ulpi-dma"
backend="baremetal"
clock="hse8-pll168"
[factory]
capabilities=true
[memory]
main_stack_bytes=2048
libc_heap_bytes=0
static_ram_limit_bytes=16384
flash_load_limit_bytes=65536
[gpio.vbus_source]
binding="source"
mode="output"
[gpio.vbus_present]
binding="present"
mode="input"
[gpio.vbus_overcurrent]
binding="oc"
mode="input"
[usb_device.fs]
binding="usbfs"
mode="otg-hs-ulpi"
event_capacity=8
rx_fifo_words=512
vbus_sensing=false
remote_wakeup=true
engine="dma"
ulpi_clock_hz=60000000
electrical_handover="external-owner"
host={channel_count=2,rx_fifo_words=128,nonperiodic_fifo_words=96,periodic_fifo_words=96,engine="dma",init_timeout_us=200000}
power={source="vbus_source",present="vbus_present",overcurrent="vbus_overcurrent",source_active_high=true,present_active_high=true,overcurrent_active_high=false,fault_timeout_us=100000}
poll_limit=128
drain_timeout_us=1000
clock_timeout_us=5000
irq={priority=5,calls_os=false}
[usb_endpoint.control_in]
controller="fs"
number=0
direction="in"
transfer="control"
max_packet=64
fifo_words=128
[usb_endpoint.control_out]
controller="fs"
number=0
direction="out"
transfer="control"
max_packet=64
[usb_endpoint.bulk_in]
controller="fs"
number=1
direction="in"
transfer="bulk"
max_packet=512
fifo_words=128
[usb_endpoint.bulk_out]
controller="fs"
number=1
direction="out"
transfer="bulk"
max_packet=512
