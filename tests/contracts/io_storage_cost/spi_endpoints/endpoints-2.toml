schema = 2
board_package = "software-board"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"
[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 65536
static_ram_limit_bytes = 32768
libc_heap_bytes = 0
[spi.spi0]
binding = "primary-spi"
mode = "short-poll"
max_hz = 1000000
[spi_device.sensor0]
controller = "spi0"
cs_binding = "primary-cs"
[spi_device.sensor1]
controller = "spi0"
cs_binding = "secondary-cs"
