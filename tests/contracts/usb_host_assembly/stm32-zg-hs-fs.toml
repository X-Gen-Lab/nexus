schema=2
board_package="stm32-zg-hs-fs-board"
backend="baremetal"
clock="hse8-pll168"
[factory]
capabilities=true
[memory]
main_stack_bytes=2048
libc_heap_bytes=0
static_ram_limit_bytes=32768
flash_load_limit_bytes=131072
[usb_host.link]
binding="host"
mode="host-hs-fs"
channel_count=2
rx_fifo_words=128
nonperiodic_fifo_words=96
periodic_fifo_words=96
engine="pio"
ulpi_clock_hz=0
drain_timeout_us=1000
init_timeout_us=200000
electrical_handover="external-owner"
irq={priority=5,calls_os=false}
