minimum_pre_commit_version: '4.3.0'
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: nexus-style
        name: Nexus format, comment and text checks
        entry: python scripts/ci/style_gate.py --staged --report build/quality/style-gate.json
        language: python
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
        require_serial: true
      - id: nexus-commit-message
        name: Nexus conventional commit message
        entry: python scripts/ci/check_commit_message.py
        language: python
        stages: [commit-msg]
      - id: nexus-docs
        name: Nexus offline documentation source and configuration checks
        entry: python tools/documentation/cli.py check --staged --report build/quality/docs-staged.json
        language: python
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
        require_serial: true
      - id: nexus-workflow-lint
        name: Nexus offline staged GitHub Actions DSL lint
        entry: python scripts/ci/lint_workflows.py --staged
        language: python
        additional_dependencies: &workflow_python
          - pre-commit==4.3.0
          - clang-format==14.0.6
          - PyYAML==6.0.3
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
        require_serial: true
      - id: nexus-tdd-gate
        name: Nexus GoogleTest and GoogleMock contract execution
        entry: python scripts/ci/tdd_gate.py --staged
        language: python
        additional_dependencies: *workflow_python
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
        require_serial: true
