schema = 2
board_package = "stm32-ve-board"
backend = "freertos"
clock = "hse8-pll168"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 16384
flash_load_limit_bytes = 65536

[i2c.primary_i2c]
binding = "primary-i2c"
mode = "dma-messages"
max_hz = 100000
[i2c.primary_i2c.irq]
priority = 5
calls_os = false
[i2c_device.primary_sensor]
controller = "primary_i2c"
address = 80

[i2c.secondary_i2c]
binding = "secondary-i2c"
mode = "dma-messages"
max_hz = 100000
[i2c.secondary_i2c.irq]
priority = 5
calls_os = false
[i2c_device.secondary_sensor]
controller = "secondary_i2c"
address = 80
