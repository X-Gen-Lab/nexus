schema=2
board_package="stm32-zg-board"
backend="freertos"
clock="hse8-pll168"
optimization="Os"
[factory]
capabilities=true
[memory]
main_stack_bytes=2048
libc_heap_bytes=0
static_ram_limit_bytes=16384
flash_load_limit_bytes=65536
[timer_capture.encoder]
binding="capture"
mode="edge-capture"
tick_hz=1000000
edge="both"
filter=3
exclusive=true
[timer_capture.encoder.irq]
priority=5
calls_os=false
[advanced_pwm.power]
binding="complementary"
mode="complementary-pwm"
tick_hz=1000000
period_ticks=1000
deadtime_ticks=128
break_active_high=true
idle_high=false
idle_complement_high=false
exclusive=true
[advanced_pwm.power.irq]
priority=5
calls_os=false
