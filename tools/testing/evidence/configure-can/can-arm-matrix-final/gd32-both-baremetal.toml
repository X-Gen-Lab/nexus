schema=2
board_package="/workspace/nexus/tests/contracts/can_assembly/gd32_board"
backend="baremetal"
clock="hxtal25-pll200"
[factory]
capabilities=true
[memory]
main_stack_bytes=2048
libc_heap_bytes=0
static_ram_limit_bytes=8192
flash_load_limit_bytes=32768
[can_domain]
split=14
filters=[{controller="bus0",bank=0,id=291,mask=2047,format="standard",fifo=0,remote=false,match_remote=true},{controller="bus1",bank=14,id=801,mask=2047,format="standard",fifo=1,remote=false,match_remote=true}]
[can.bus0]
binding="can0"
mode="classic-irq"
operation="loopback"
event_capacity=8
bitrate=500000
drain_timeout_us=1000
poll_limit=128
fifo_order=true
timing={prescaler=5,segment1=16,segment2=3,sjw=2}
[can.bus0.irq]
priority=5
calls_os=false
[can.bus1]
binding="can1"
mode="classic-irq"
operation="loopback"
event_capacity=8
bitrate=500000
drain_timeout_us=1000
poll_limit=128
fifo_order=true
timing={prescaler=5,segment1=16,segment2=3,sjw=2}
[can.bus1.irq]
priority=5
calls_os=false
