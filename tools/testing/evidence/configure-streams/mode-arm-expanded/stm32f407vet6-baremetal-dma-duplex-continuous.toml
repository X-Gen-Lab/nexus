schema = 2
board_package = "/workspace/nexus/tests/contracts/stm32_assembly/ve_board"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0

[uart.link]
binding = "uart1"
mode = "dma-duplex-continuous"
baud = 115200

[uart.link.rx]
format = "blocks"

[uart.link.irq]
priority = 5
calls_os = false
