schema = 2
board_package = "/workspace/nexus/tests/contracts/stm32_assembly/ve_board"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0

[adc.samples]
binding = "adc_scan"
mode = "trigger-dma-continuous"
channels = [0, 1]
sample_times = [0, 7]
reference_mv = 3300

[adc.samples.irq]
priority = 5
calls_os = false
