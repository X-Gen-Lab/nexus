schema = 2
board_package = "/workspace/nexus/tests/contracts/gd32_assembly/software_board"
backend = "freertos"
clock = "hxtal25-pll200"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0

[uart.link]
binding = "uart0"
mode = "rx-dma-idle"
baud = 115200

[uart.link.rx]
format = "blocks"

[uart.link.irq]
priority = 5
calls_os = false
