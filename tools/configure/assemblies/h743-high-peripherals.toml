# Software-only V-cut reference: electrical assumptions require physical review.
schema = 2
board_package = "../../../boards/stm32h743zi_hsi_reference"
backend = "baremetal"
clock = "hsi64-pll384-cache-off"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 16384
flash_load_limit_bytes = 65536

[gpio.led]
binding = "led0"
mode = "output"

[uart.console]
binding = "uart3"
mode = "irq-bytes"
baud = 115200
[uart.console.rx]
format = "bytes"
capacity = 64
[uart.console.irq]
priority = 5
calls_os = false

[spi.bus4]
binding = "spi4"
mode = "short-poll"
max_hz = 1500000

[spi_device.device4]
controller = "bus4"
driver = "spi-endpoint"
cs_binding = "spi4-cs"
mode = 0
max_hz = 1500000

[pwm.wave3]
binding = "pwm3"
mode = "fixed-pwm"
period_ticks = 1000
duty_ticks = 250
tick_hz = 1000000

[i2c.bus1]
binding = "i2c1"
mode = "poll-messages"
max_hz = 100000
[i2c.bus1.timing]
kernel_hz_min = 62000000
kernel_hz_max = 65000000
pclk_hz_min = 91140000
bus_hz_min = 60000
rise_ns_max = 1000
fall_ns_max = 300
source = "DS12110 Rev11 Table134 V-cut HSI envelope; declared pull-up/rise/fall bounds, not measured"

[i2c_device.device1]
controller = "bus1"
driver = "i2c-endpoint"
address = 80

[adc.sensor]
binding = "adc1"
mode = "single-shot"
channels = [15]
sample_times = [7]
reference_mv = 3300

[flash.storage]
binding = "flash0"
mode = "poll-word"
