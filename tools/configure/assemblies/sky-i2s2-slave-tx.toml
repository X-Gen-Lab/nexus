schema = 2
board = "stm32f407ve_sky_qingchun"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 65536
static_ram_limit_bytes = 32768
libc_heap_bytes = 0

# Chip pin capability only; no audio PCB or external master is qualified.
[i2s2]
profile = "slave-tx-stereo16-pb12-pb13-pb15"
