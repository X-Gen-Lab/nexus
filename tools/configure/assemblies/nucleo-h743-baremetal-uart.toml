schema = 2
board_package = "../../../boards/stm32h743_nucleo_zi2"
backend = "baremetal"
clock = "hsi64-fixed-cache-off"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 16384
flash_load_limit_bytes = 65536

[gpio.led0]
binding = "led0"
mode = "output"

[uart.uart3]
binding = "uart3"
mode = "irq-bytes"
baud = 115200
[uart.uart3.rx]
format = "bytes"
capacity = 64
[uart.uart3.irq]
priority = 5
calls_os = false
