schema = 2
board_package = "../../../boards/stm32u575_nucleo_zi_q"
backend = "freertos"
clock = "msis4"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 16384
flash_load_limit_bytes = 65536

[os]
profile = "standard"
tick_source = "systick"
tick_hz = 1000
syscall_priority = 5

[gpio.led0]
binding = "led0"
mode = "output"

[uart.uart1]
binding = "uart1"
mode = "irq-bytes"
baud = 115200
[uart.uart1.rx]
format = "bytes"
capacity = 64
[uart.uart1.irq]
priority = 5
calls_os = false
