schema = 2
board_package = "../../../boards/stm32h743zi_hsi_reference"
backend = "baremetal"
clock = "hsi64-fixed-cache-on"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 16384
flash_load_limit_bytes = 65536


[uart.console]
binding = "uart3"
mode = "rx-dma-continuous"
baud = 115200
[uart.console.rx]
format = "blocks"
[uart.console.irq]
priority = 5
calls_os = false
