schema = 2
board_package = ".."
backend = "baremetal"
clock = "hse25-crystal-pll72"

[hardware]
phy_management_wiring = "pc1-pa2-external-phy"

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0
static_ram_limit_bytes = 4096
flash_load_limit_bytes = 16384

[mdio.phy]
binding = "station-management"
mode = "clause22"
