schema = 2
board_package = ".."
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[hardware]
sram_population = "is62wv51216"

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 65536
static_ram_limit_bytes = 32768
libc_heap_bytes = 0

[memory.regions.addsram]
limit_bytes = 4096

[external_bus.ext0]
binding = "fsmc0"
mode = "async16"

[memory_window.ram0]
controller = "ext0"
binding = "sram0"
mode = "startup-memory"
read_timing = { address_setup = 2, address_hold = 1, data_setup = 9, bus_turn = 1 }
write_timing = { address_setup = 2, address_hold = 1, data_setup = 9, bus_turn = 1 }
