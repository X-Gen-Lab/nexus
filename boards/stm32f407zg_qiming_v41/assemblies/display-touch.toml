schema = 2
board_package = ".."
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[hardware]
debug_port = "swd"
display_module = "ili9341-16bit"
touch_module = "xpt2046-gpio"

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 131072
static_ram_limit_bytes = 32768
libc_heap_bytes = 0

[external_bus.ext0]
binding = "fsmc0"
mode = "async16"

# Conservative software-reference fields; exact module timing remains unproved.
[parallel16.panel0]
controller = "ext0"
binding = "lcd0"
read_timing = { address_setup = 15, address_hold = 1, data_setup = 100, bus_turn = 2 }
write_timing = { address_setup = 4, address_hold = 1, data_setup = 15, bus_turn = 2 }

[gpio.backlight]
binding = "lcd-backlight"
mode = "output"

[gpio.touch-clk]
binding = "touch-clk"
mode = "output"

[gpio.touch-mosi]
binding = "touch-mosi"
mode = "output"

[gpio.touch-cs]
binding = "touch-cs"
mode = "output"

[gpio.touch-miso]
binding = "touch-miso"
mode = "input"
pull = "none"

[exti.pen]
binding = "touch-pen-edge"
mode = "edge-event"
edge = "both"
pull = "none"
event_capacity = 8

[exti.pen.irq]
priority = 5
calls_os = false
