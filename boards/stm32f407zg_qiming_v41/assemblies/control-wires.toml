# Explicit software-reference GPIO wires, not complete codec/camera support.
schema=2
board_package=".."
backend="baremetal"
clock="hse8-pll168"
optimization="Os"
[memory]
main_stack_bytes=4096
libc_heap_bytes=0
static_ram_limit_bytes=32768
flash_load_limit_bytes=65536
[hardware]
audio_module="wm8978"
camera_module="ov2640"
[gpio.camera-scl]
binding="camera-scl"
mode="output"
output_type="open-drain"
pull="none"
[gpio.camera-sda]
binding="camera-sda"
mode="output"
output_type="open-drain"
pull="none"
[gpio.audio-scl]
binding="audio-scl"
mode="output"
output_type="open-drain"
pull="none"
[gpio.audio-sda]
binding="audio-sda"
mode="output"
output_type="open-drain"
pull="none"
