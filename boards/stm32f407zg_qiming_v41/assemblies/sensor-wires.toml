# Software-reference wires only; actual sensor/remote fitting is unverified.
schema=2
board_package=".."
backend="baremetal"
clock="hse8-pll168"
optimization="Os"
[memory]
main_stack_bytes=4096
libc_heap_bytes=0
static_ram_limit_bytes=32768
flash_load_limit_bytes=65536
[hardware]
debug_port="swd"
temperature_module="ds18b20-external-vdd"
infrared_module="hs0038"
[gpio.onewire]
binding="onewire-data"
mode="output"
output_type="open-drain"
pull="none"
[gpio.beeper]
binding="beeper"
mode="output"
[exti.infrared]
binding="infrared-edge"
mode="edge-event"
edge="both"
pull="none"
event_capacity=128
[exti.infrared.irq]
priority=5
calls_os=false
