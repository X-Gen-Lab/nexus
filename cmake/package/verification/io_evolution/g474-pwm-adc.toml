schema = 2
board_package = "boards/g474-pwm-adc"
backend = "baremetal"
clock = "hse24-pll170"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0

[pwm_adc.window]
binding = "window"
mode = "finite-regular-dma"
tick_hz = 1000000
period_ticks = 100
trigger_ticks = 50
deadtime_ticks = 170
channels = [1]
sample_times = [0]
reference_mv = 3300
exclusive = true

[pwm_adc.window.irq]
priority = 5
calls_os = false
