schema = 2
board_package = "boards/g474-pwm-shared"
backend = "baremetal"
clock = "hse24-pll170"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0

[pwm.left]
binding = "left-output"
mode = "shared-fixed-pwm"
tick_hz = 1000000
period_ticks = 1000
duty_ticks = 250

[pwm.right]
binding = "right-output"
mode = "shared-fixed-pwm"
tick_hz = 1000000
period_ticks = 1000
duty_ticks = 750
