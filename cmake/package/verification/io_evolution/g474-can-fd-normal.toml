schema = 2
board_package = "boards/g474-fdcan"
backend = "baremetal"
clock = "hse24-pll170"
optimization = "Os"

[factory]
capabilities = true

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0

[can_fd.fieldbus]
binding = "fieldbus"
mode = "iso-fd-normal"
bitrate = 500000
data_bitrate = 2000000
event_capacity = 4
drain_timeout_us = 100000
poll_limit = 1000000
exclusive = true
filters = [{ id = 256, mask = 2047, format = "standard", fifo = 0 }]

[can_fd.fieldbus.irq]
priority = 5
calls_os = false
