schema = 2
board = "stm32f407ve_sky_qingchun"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"
layout = "layout.json"

[memory]
main_stack_bytes = 8192
flash_load_limit_bytes = 131072
static_ram_limit_bytes = 32768
libc_heap_bytes = 0

[flash.physical]
binding = "flash0"
mode = "poll-word"
