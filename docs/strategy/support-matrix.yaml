      record: docs/implementation/platform-drivers.md
    limits:
      - PCB revision, 8 MHz HSE wiring, supply and ST HAL Flash conditions need board confirmation.
      - Flash sectors 10/11 are reserved; application occupies the preceding 768 KiB.
      - Flash erase/program runs in a product-defined maintenance window.
      - Production HAL startup executes stm32_platform_init; global in-process shutdown is unsupported.
      - IRQ/DMA/device/scheduler ownership remains active until controlled reset; HAL_DeInit is not complete teardown.
      - RS485 requires external transceiver, wiring, termination, biasing and a product UART/DE/RE adapter.
      - MCU crypto provider and protected boot/update/key-vault ports are not integrated.
