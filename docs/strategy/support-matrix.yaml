capability_limits:
  typed_i2c:
    native: implemented_and_executed
    stm32: modern_hardware_provider_not_implemented_explicit_unsupported
    gd32f470: modern_hardware_provider_not_implemented_explicit_unsupported
  flash_layout:
    default: whole_physical_flash_image_no_reserved_storage_regions
    image_offset: zero_only_no_bootloader_or_VTOR_relocation
    regions: consumer_owned_validated_permissions_and_full_erase_blocks
  board_validation: reviewed_GPIO_UART_SPI_routes_not_complete_topology_solver
  memory_info: main_SRAM_and_internal_Flash_only_not_all_domains_or_DMA_map
  mcu_crypto: no_provider_entropy_vault_binding_explicit_unsupported
  platform_lifecycle: bounded_idle_baremetal_or_pre_scheduler_cleanup_reinit_partial_failures_retain_ownership_and_admission_fence
  kernel_restart: not_supported_running_or_suspended_MCU_FreeRTOS_shutdown_is_BUSY
