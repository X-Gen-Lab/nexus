# STM32F407 controller Kconfig template example.
# This helper emits draft text; the maintained effective configuration and
# reviewed Board routes remain authoritative. It does not implement providers.
# Usage:
#   python scripts/kconfig_tools/cli.py batch-generate -c examples/stm32_config.yaml -o soc/stm32f407/controllers/

peripherals:
  - type: UART
    platform: STM32
    instances: 6
    output: uart/Kconfig
    description: "F407 UART draft; only reviewed configured routes are usable"
  - type: GPIO
    platform: STM32
    instances: 9
    output: gpio/Kconfig
    description: "F407 GPIO draft; Board manifest selects real pin ownership"
  - type: SPI
    platform: STM32
    instances: 3
    output: spi/Kconfig
    description: "F407 SPI draft; only reviewed configured routes are usable"

options:
  overwrite: false
  validate: true
  verbose: true
