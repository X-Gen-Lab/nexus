name: Tool Contracts

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tooling:
    name: Configuration, build and SDK failure boundaries
    runs-on: ubuntu-24.04
    # Allow real SDK builds, the complete test plan and evidence uploads.
    timeout-minutes: 60
    env:
      NEXUS_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
        with:
          preset: native-debug
          arm: 'true'
      - name: Select and verify the locked Native compiler
        run: |
          .venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess

          lock = json.loads(
              Path("dependencies/environment.lock.json").read_text())
          expected = lock["native_compiler"]["version"]
          major = expected.split(".", 1)[0]
          directory = Path(os.environ["RUNNER_TEMP"]) / "nexus-native-toolchain"
          directory.mkdir()
          for name in ("gcc", "g++"):
              compiler = shutil.which(f"{name}-{major}")
              if compiler is None:
                  raise SystemExit(f"Missing locked Native compiler {name}-{major}")
              observed = subprocess.check_output(
                  [compiler, "-dumpfullversion"], text=True).strip()
              if observed != expected:
                  raise SystemExit(
                      f"{name} differs from locked {expected}: {observed}")
              (directory / name).symlink_to(compiler)
              print(f"{name}: {observed} ({compiler})")
          with open(os.environ["GITHUB_PATH"], "a") as output:
              output.write(str(directory) + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"CC={directory / 'gcc'}\n")
              output.write(f"CXX={directory / 'g++'}\n")
          PY
      - name: Prepare commit-hook environments before offline tests
        run: .venv/bin/python -I -m pre_commit install-hooks
      - name: Use the installed CLI tools for real consumer builds
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Prepare the actual compiler and generated inputs for tool fixtures
        run: |
          .venv/bin/python tools/dev/dev.py doctor --target contracts
          .venv/bin/python tools/dev/dev.py configure --preset native-debug
          .venv/bin/python tools/dev/dev.py build --preset native-debug --target nexus_google_contracts --parallel 4
      - name: Execute each tool domain once
        run: |
          .venv/bin/python -B tools/testing/run_tool_tests.py --suite workflows --report build/quality/tools-workflows.json
          .venv/bin/python -B tools/testing/run_tool_tests.py --suite ci --report build/quality/tools-ci.json
          .venv/bin/python -B tools/testing/run_tool_tests.py --suite configure --report build/quality/tools-configure.json
          .venv/bin/python -B tools/testing/run_tool_tests.py --suite testing --report build/quality/tools-testing.json
      - name: Check declared source compatibility
        run: |
          .venv/bin/python tools/maintenance/compatibility.py
      - name: Execute tamper, budget, HIL and relocated SDK boundaries
        run: |
          mkdir -p build/quality
          .venv/bin/python -B tools/testing/run_tool_tests.py --suite contracts --report build/quality/tools-contracts.json 2>&1 | tee build/quality/tool-contracts.log
          .venv/bin/python -B tools/testing/run_tool_tests.py --suite freertos --report build/quality/tools-freertos.json
        env:
          NEXUS_ARM_GCC: arm-none-eabi-gcc
      - name: Preserve executed tool evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tool-contracts
          path: |
            build/setup-dependencies.json
            build/quality/tool-contracts.log
            build/quality/tools-contracts.json
            build/quality/tools-freertos.json
            build/quality/tools-configure.json
            build/quality/tools-testing.json
            build/quality/tools-ci.json
            build/quality/tools-workflows.json
            build/native-debug/tdd/
            build/native-debug/compile_commands.json
            build/native-debug/generated/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
      # A station template with no probe/serial binding is rejected. These
      # software tests do not open a production station or establish board HIL.

  sdk-consumers:
    name: Committed Source SDK consumers
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NEXUS_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      NEXUS_CHANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      NEXUS_SDK_ALL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: false
      - id: scope
        name: Select SDK work for the exact change
        run: python3 scripts/ci/sdk_consumers.py --plan
      - uses: ./.github/actions/setup-build
        if: steps.scope.outputs.selected == 'true'
        with:
          preset: stm32-qiming-baremetal
          arm: 'true'
      - name: Export, relocate and exercise the selected consumers
        if: steps.scope.outputs.selected == 'true'
        run: .venv/bin/python scripts/ci/sdk_consumers.py --output build/quality/sdk-consumers --allow-network
      - name: Preserve SDK consumer results
        if: always() && steps.scope.outputs.selected == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-sdk-consumers
          path: |
            build/quality/sdk-consumers/verification.json
            build/quality/sdk-consumers/command-*.log
          if-no-files-found: error
          retention-days: 30
