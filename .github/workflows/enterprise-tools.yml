name: Tool Contracts

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tooling:
    name: Configuration, evidence and SDK failure boundaries
    runs-on: ubuntu-24.04
    # Allow real SDK builds, the complete test plan and evidence uploads.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
        with:
          preset: native-debug
          arm: 'true'
      - name: Prepare commit-hook environments before offline tests
        run: .venv/bin/python -I -m pre_commit install-hooks
      - name: Use the installed CLI tools for real consumer builds
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Execute configuration rejection and atomic generation
        run: >-
          .venv/bin/python -B tools/testing/run_tool_tests.py --suite configure
          --report build/quality/tools-configure.json
      - name: Check derived capability text and report review assignment gaps
        run: |
          .venv/bin/python tools/maintenance/capabilities.py --check
          .venv/bin/python tools/maintenance/compatibility.py
          .venv/bin/python tools/maintenance/ownership.py --require-assigned
      - name: Execute tamper, budget, HIL and relocated SDK boundaries
        run: |
          mkdir -p build/quality
          .venv/bin/python -B tools/testing/run_tool_tests.py --suite contracts --report build/quality/tools-contracts.json 2>&1 | tee build/quality/tool-contracts.log
          .venv/bin/python -B tools/testing/run_tool_tests.py --suite freertos --report build/quality/tools-freertos.json
        env:
          NEXUS_ARM_GCC: arm-none-eabi-gcc
      - name: Execute commit and analyzer orchestration boundaries
        run: |
          .venv/bin/python -B tools/testing/run_tool_tests.py --suite ci --report build/quality/tools-ci.json
          .venv/bin/python -B tools/testing/run_tool_tests.py --suite workflows --report build/quality/tools-workflows.json
      - name: Execute Google report admission and station preparation boundaries
        run: |
          .venv/bin/python -B tools/testing/run_tool_tests.py --suite testing --report build/quality/tools-testing.json
          .venv/bin/python -B -m tools.hil.prepare --help
      - name: Bind the upload to observed execution identity
        if: always()
        uses: ./.github/actions/record-identity
        with:
          job: tooling
          result: ${{ job.status }}
          expected-commit: ${{ github.sha }}
          output: build/job-identities/tooling
          require-dependencies: 'true'
          artifacts: |
            build/quality/tool-contracts.log
            build/quality/tools-contracts.json
            build/quality/tools-freertos.json
            build/quality/tools-configure.json
            build/quality/tools-testing.json
            build/quality/tools-ci.json
            build/quality/tools-workflows.json
          tools: |
            python=python3
            cmake=cmake
            compiler=arm-none-eabi-gcc
      - name: Preserve executed tool evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tool-contracts
          path: |
            build/quality/tool-contracts.log
            build/quality/tools-contracts.json
            build/quality/tools-freertos.json
            build/quality/tools-configure.json
            build/quality/tools-testing.json
            build/quality/tools-ci.json
            build/quality/tools-workflows.json
            build/job-identities/tooling/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
      # A station template with no probe/serial binding is rejected. These
      # software tests do not open a production station or establish board HIL.
