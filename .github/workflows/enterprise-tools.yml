name: Enterprise Delivery Tools

on:
  push:
    branches: [main, develop, 'codex/**']
    paths:
      - 'scripts/evidence/**'
      - 'scripts/hil/**'
      - 'scripts/manufacturing/**'
      - 'docs/requirements/**'
      - 'docs/strategy/backlog.csv'
      - '.github/maintainer-roles.json'
      - '.github/workflows/enterprise-tools.yml'
  pull_request:
    paths:
      - 'scripts/evidence/**'
      - 'scripts/hil/**'
      - 'scripts/manufacturing/**'
      - 'docs/requirements/**'
      - 'docs/strategy/backlog.csv'
      - '.github/maintainer-roles.json'
      - '.github/workflows/enterprise-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery-contracts:
    name: Delivery contracts and requirement consistency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Exercise adapter and tamper failure boundaries
        shell: bash
        run: |
          mkdir -p build/evidence
          openssl version
          python -m unittest discover -s scripts/evidence -p 'test_*.py' -v \
            2>&1 | tee build/evidence/enterprise-tools-tests.log
      - name: Validate approved roles and requirement mapping
        run: python scripts/evidence/check_traceability.py --report build/evidence/traceability.json
      - name: Preserve consistency result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enterprise-tool-contracts-python-${{ matrix.python }}
          path: |
            build/evidence/traceability.json
            build/evidence/enterprise-tools-tests.log
          if-no-files-found: error
      # Adapter fixtures do not use hardware. Physical HIL must be run on a
      # reviewed lab station manifest, not on an untrusted pull-request runner.
