name: Documentation Build

on:
  workflow_call:
    inputs:
      emit_pages:
        description: Upload a Pages artifact after trusted main verification
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
      - name: Setup the qualified Python tuple
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Prepare the documented F4 and FreeRTOS source closure
        run: >-
          python3 -B tools/dev/dependencies.py prepare --scope arm
          --family stm32f4 --backend freertos --allow-network
          --report build/dependencies/docs-build-freertos.json
      - name: Prepare the documented ThreadX source closure
        run: >-
          python3 -B tools/dev/dependencies.py prepare --scope arm
          --family stm32f4 --backend threadx --allow-network
          --report build/dependencies/docs-build-threadx.json
      - name: Prepare the complete hash-locked documentation closure
        run: >-
          python3 tools/documentation/install.py
          --prefix "$RUNNER_TEMP/nexus-docs-tools"
          --cache "$RUNNER_TEMP/nexus-docs-cache"
      - name: Execute documentation tool tests
        run: >-
          python3 tools/documentation/cli.py test
          --tool-prefix "$RUNNER_TEMP/nexus-docs-tools"
          --report build/quality/docs-tests.json
      - name: Build complete English and Chinese documentation
        run: >-
          python3 tools/documentation/cli.py build
          --tool-prefix "$RUNNER_TEMP/nexus-docs-tools"
          --output build/documentation --mode verify --language all
      - name: Preserve successful documentation output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: |
            build/documentation/site/
            build/documentation/documentation-build.json
            build/dependencies/docs-build-*.json
            build/quality/docs-tests.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Upload the verified Pages site
        if: >-
          success() && inputs.emit_pages && github.ref == 'refs/heads/main'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: build/documentation/site
          retention-days: 1
      - name: Preserve failed documentation diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-failure-diagnostics
          path: |
            build/documentation/documentation-build.json
            build/documentation/last-published.json
            build/documentation/work/source-check.json
            build/documentation/work/*.command.json
            build/documentation/work/*.log
            build/documentation/work/*.attempts/*/receipt.json
            build/documentation/work/*.attempts/*/stdout.txt
            build/documentation/work/*.attempts/*/stderr.txt
            build/documentation-attempts/**/tests.command.json
            build/documentation-attempts/**/tests.log
            build/documentation-attempts/**/receipt.json
            build/documentation-attempts/**/stdout.txt
            build/documentation-attempts/**/stderr.txt
            build/dependencies/docs-build-*.json
            build/quality/docs-tests.json
          if-no-files-found: ignore
          retention-days: 14
