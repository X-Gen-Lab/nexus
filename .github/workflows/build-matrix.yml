name: Platform Contracts

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  native:
    name: Native contracts (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [native-debug, native-release, native-asan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
        with:
          preset: ${{ matrix.preset }}
      - name: Configure actual target graph
        run: .venv/bin/python tools/dev/dev.py configure --preset "${{ matrix.preset }}"
      - name: Build platform and register models
        run: .venv/bin/python tools/dev/dev.py build --preset "${{ matrix.preset }}" --parallel 4
      - name: Execute the complete CTest and GoogleTest contracts once
        run: >-
          .venv/bin/python scripts/ci/native_contracts.py
          --preset "${{ matrix.preset }}"
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contracts-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/ctest-results.xml
            build/${{ matrix.preset }}/Testing/Temporary/
            build/${{ matrix.preset }}/generated/
            build/${{ matrix.preset }}/compile_commands.json
            build/${{ matrix.preset }}/tdd/
            build/${{ matrix.preset }}/google-contracts.json
          if-no-files-found: error

  arm:
    name: ARM link and budgets (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset:
          - stm32-qiming-baremetal
          - stm32-qiming-freertos
          - stm32-sky-baremetal
          - stm32-sky-freertos
          - gd32-liangshan-baremetal
          - gd32-liangshan-freertos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
        with:
          preset: ${{ matrix.preset }}
          arm: 'true'
      - name: Configure the selected static assembly
        run: .venv/bin/python tools/dev/dev.py configure --preset "${{ matrix.preset }}"
      - name: Link the actual reset vector and selected providers
        run: >-
          .venv/bin/python tools/dev/dev.py build --preset "${{ matrix.preset }}"
          --parallel 4 --target nexus_firmware nexus_bus_owner nexus_spi_owner
          nexus_uart_owner nexus_bmp280 nexus_bmp280_spi nexus_log nexus_storage
          nexus_flash_storage nexus_modbus
      - name: Verify physical memory and configuration identity
        run: >-
          .venv/bin/python tools/measurement/resources.py
          --elf build/${{ matrix.preset }}/bin/nexus_firmware.elf
          --resolved build/${{ matrix.preset }}/generated/resolved.json
          --budget build/${{ matrix.preset }}/generated/resource-budget.json
          --report build/${{ matrix.preset }}/resource-report.json
      - name: Prepare the unbound physical station work plan
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          case "$PRESET" in
            stm32-qiming-*) fixture=stm32f407_qiming_v31 ;;
            stm32-sky-*) fixture=stm32f407ve_sky_qingchun ;;
            gd32-liangshan-*) fixture=gd32f470_liangshan ;;
            *) exit 1 ;;
          esac
          .venv/bin/python -B tools/hil/prepare.py \
            --fixture "tools/hil/fixtures/$fixture.json" \
            --resolved "build/$PRESET/generated/resolved.json" \
            --report "build/$PRESET/hil-preparation.json"
      - name: Preserve linked software evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: software-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/bin/
            build/${{ matrix.preset }}/generated/
            build/${{ matrix.preset }}/compile_commands.json
            build/${{ matrix.preset }}/resource-report.json
            build/${{ matrix.preset }}/hil-preparation.json
          if-no-files-found: error
      # ARM linking and modeled peripheral tests establish software contracts.
      # Probe/serial execution and physical timing remain separate HIL evidence.

  controller-routes:
    name: Advanced controller software fixtures (${{ matrix.family }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        family: [stm32, gd32]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
        with:
          preset: native-debug
          arm: 'true'
      - name: Link each explicitly marked software board and peripheral mode
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          fixture="tests/contracts/${FAMILY}_assembly"
          count=0
          for assembly in "$fixture"/*.toml; do
            name="$(basename "$assembly" .toml)"
            output="build/controller-routes/$FAMILY/$name"
            .venv/bin/cmake -S "$fixture" -B "$output" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/toolchains/arm-gcc.cmake" \
              -DNEXUS_SOURCE_ROOT="$GITHUB_WORKSPACE" \
              -DNEXUS_ASSEMBLY_FILE="$GITHUB_WORKSPACE/$assembly"
            .venv/bin/cmake --build "$output" --parallel 4
            count=$((count + 1))
          done
          test "$count" -gt 0
      - name: Retain the actual peripheral link and budget evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controller-software-${{ matrix.family }}
          path: build/controller-routes/
          if-no-files-found: error
      # These fixtures exercise real providers and static constructors. They
      # declare unknown PCB revisions; they do not assert three-board wiring.
