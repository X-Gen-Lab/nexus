name: Build Matrix

on:
  workflow_call:

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  matrix-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC Debug
            os: ubuntu-latest
            preset: linux-gcc-debug
            upload_artifacts: false
          - name: Linux GCC Release
            os: ubuntu-latest
            preset: linux-gcc-release
            upload_artifacts: true
          - name: Linux Clang Release
            os: ubuntu-latest
            preset: linux-clang-release
            upload_artifacts: false
          - name: STM32F407 Baremetal Release
            os: ubuntu-latest
            preset: stm32-armgcc-release
            upload_artifacts: true
            is_arm: true
          - name: STM32F407 FreeRTOS Release
            os: ubuntu-latest
            preset: stm32-armgcc-freertos-release
            upload_artifacts: true
            is_arm: true
          - name: GD32F470ZG Liangshan Baremetal Release
            os: ubuntu-latest
            preset: gd32f470-armgcc-baremetal-release
            upload_artifacts: true
            is_arm: true
          - name: STM32F407ZG Qiming V3.1 Baremetal Release
            os: ubuntu-latest
            preset: stm32-qiming-armgcc-baremetal-release
            upload_artifacts: true
            is_arm: true
          - name: STM32F407ZG Qiming V3.1 FreeRTOS Release
            os: ubuntu-latest
            preset: stm32-qiming-armgcc-freertos-release
            upload_artifacts: true
            is_arm: true
          - name: STM32F407VE Sky Youth Baremetal Release
            os: ubuntu-latest
            preset: stm32-sky-armgcc-baremetal-release
            upload_artifacts: true
            is_arm: true
          - name: STM32F407VE Sky Youth FreeRTOS Release
            os: ubuntu-latest
            preset: stm32-sky-armgcc-freertos-release
            upload_artifacts: true
            is_arm: true
          - name: GD32F470ZG Liangshan FreeRTOS Release
            os: ubuntu-latest
            preset: gd32f470-armgcc-freertos-release
            upload_artifacts: true
            is_arm: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          os: ${{ matrix.os }}
          preset: ${{ matrix.preset }}

      - name: Initialize Maintained Dependencies
        run: git submodule update --init ext/googletest ext/freertos vendors/arm/CMSIS_5 vendors/st/cmsis_device_f4 vendors/st/stm32f4xx_hal_driver

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4

      - name: Verify ARM Firmware Static Contract
        if: matrix.is_arm
        run: >-
          python3 scripts/ci/validate_firmware_elf.py
          --build-dir build/${{ matrix.preset }}
          --report build/${{ matrix.preset }}/firmware-static-contract.json

      - name: Test
        if: ${{ !matrix.is_arm }}
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error --parallel 4 --output-junit "${{ github.workspace }}/build/${{ matrix.preset }}/ctest-results.xml"

      - name: Verify ARM Artifact Rejection Paths
        if: matrix.is_arm
        run: python3 -m unittest discover -s scripts/ci -p test_validate_firmware_elf.py
        env:
          NEXUS_FIRMWARE_TEST_BUILD: build/${{ matrix.preset }}

      - name: Verify actual release configuration and production compile database
        if: ${{ matrix.is_arm || matrix.preset == 'linux-gcc-release' }}
        run: python3 scripts/ci/test_package_release.py ActualReleaseCompileDatabaseTests -v
        env:
          NEXUS_RELEASE_TEST_BUILD: build/${{ matrix.preset }}
          NEXUS_RELEASE_TEST_PRESET: ${{ matrix.preset }}

      - name: Upload Artifacts
        if: matrix.upload_artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/bin/*
            build/${{ matrix.preset }}/lib/*
            build/${{ matrix.preset }}/generated/*
            build/${{ matrix.preset }}/CMakeCache.txt
            build/${{ matrix.preset }}/compile_commands.json
            build/${{ matrix.preset }}/ctest-results.xml
            build/${{ matrix.preset }}/firmware-static-contract.json
          retention-days: 7
          if-no-files-found: error

  coverage:
    name: Coverage Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          os: ubuntu-latest
          preset: linux-gcc-coverage

      - name: Initialize Maintained Dependencies
        run: git submodule update --init ext/googletest ext/freertos vendors/arm/CMSIS_5 vendors/st/cmsis_device_f4 vendors/st/stm32f4xx_hal_driver

      - name: Configure
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          cmake --preset linux-gcc-coverage

      - name: Build
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          cmake --build --preset linux-gcc-coverage --parallel 4

      - name: Test
        run: ctest --preset linux-gcc-coverage --output-on-failure --no-tests=error --parallel 4

      - name: Generate Coverage
        run: |
          # Native runtime scope; boards/soc need separate ARM coverage evidence.
          lcov --capture --directory build/linux-gcc-coverage --output-file coverage.info \
            --include "${{ github.workspace }}/arch/*" \
            --include "${{ github.workspace }}/products/*" \
            --include "${{ github.workspace }}/hal/*" \
            --include "${{ github.workspace }}/osal/*" \
            --include "${{ github.workspace }}/framework/*" \
            --include "${{ github.workspace }}/services/*" \
            --include "${{ github.workspace }}/platforms/*"
          test -s coverage.info
          grep -q '^SF:' coverage.info
          genhtml coverage.info --output-directory coverage_html

      - name: Upload Coverage Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage_html/
          retention-days: 30

  sanitizer:
    name: ASan and UBSan service contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          os: ubuntu-latest
          preset: linux-gcc-sanitizers
      - name: Initialize Maintained Dependencies
        run: git submodule update --init ext/googletest ext/freertos vendors/arm/CMSIS_5 vendors/st/cmsis_device_f4 vendors/st/stm32f4xx_hal_driver
      - name: Configure
        run: cmake --preset linux-gcc-sanitizers
      - name: Build Contract Targets
        run: >-
          cmake --build --preset linux-gcc-sanitizers --parallel 4 --target
          osal_contract_tests baremetal_contract_tests init_registry_tests nexus_industrial_tests
          native_registry_contract_tests posix_event_contract_tests unbound_platform_contract_tests log_contract_tests
          blinky config_demo shell_demo freertos_demo nexus_industrial_controller
          crypto_tests crypto_partial_tests crypto_unconfigured_tests
          storage_tests config_persistence_tests update_tests update_storage_tests
          test_driver_stm32_spi_bare test_driver_stm32_spi_osal test_driver_stm32_gpio
          test_driver_stm32_uart test_driver_stm32_uart_clock
          test_driver_stm32_flash_geometry test_driver_stm32_flash_512k
          test_driver_stm32_flash_1m test_driver_stm32_flash_mismatched
          test_driver_gd32_uart test_driver_gd32_spi test_driver_gd32_timebase test_driver_gd32_flash
          test_driver_gd32_typed_spi
          arch_contract_tests typed_device_contract_tests typed_native_spi_tests typed_stm32_gpio_registration
          product_boot_contract_tests product_native_smoke
          test_board_stm32f407_qiming_v31 test_board_stm32f407ve_sky_qingchun
      - name: Run Contract Targets
        run: >-
          ctest --preset linux-gcc-sanitizers --parallel 1 --output-on-failure --no-tests=error
          -R '^(osal_contract_tests|baremetal_contract_tests|init_registry_tests|crypto_tests|crypto_partial_tests|crypto_unconfigured_tests|storage_tests|config_persistence_tests|update_tests|update_storage_tests|driver_stm32_spi_bare|driver_stm32_spi_osal|driver_stm32_gpio|driver_stm32_uart|driver_stm32_uart_clock|driver_stm32_flash_.*|driver_gd32_.*|arch_contract_tests|TypedDevice\..*|TypedSPI\..*|TypedNativeSPI\..*|TypedNativeDelayedSPI\..*|typed_stm32_gpio_registration|product_boot_contract_tests|product_native_smoke|board_stm32f407_qiming_v31|board_stm32f407ve_sky_qingchun|nexus_industrial_tests|native_registry_contract_tests|posix_event_contract_tests|unbound_platform_contract_tests|log_contract_tests|native_blinky_smoke|native_config_demo_smoke|native_shell_demo_smoke|native_freertos_demo_smoke|native_industrial_controller_smoke)$'
          --output-junit "${{ github.workspace }}/build/linux-gcc-sanitizers/ctest-results.xml"
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      - name: Upload Sanitizer Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanitizer-contract-evidence
          path: |
            build/linux-gcc-sanitizers/Testing/Temporary/*.log
            build/linux-gcc-sanitizers/ctest-results.xml
            build/linux-gcc-sanitizers/generated/*
          retention-days: 7
