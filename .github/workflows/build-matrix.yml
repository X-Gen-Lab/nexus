name: Build Matrix

on:
  workflow_call:

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  matrix-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC Debug
            os: ubuntu-latest
            preset: linux-gcc-debug
            upload_artifacts: false
          - name: Linux GCC Release
            os: ubuntu-latest
            preset: linux-gcc-release
            upload_artifacts: true
          - name: Linux Clang Release
            os: ubuntu-latest
            preset: linux-clang-release
            upload_artifacts: false
          - name: STM32F407 Baremetal Release
            os: ubuntu-latest
            preset: stm32-armgcc-release
            upload_artifacts: true
            is_arm: true
          - name: STM32F407 FreeRTOS Release
            os: ubuntu-latest
            preset: stm32-armgcc-freertos-release
            upload_artifacts: true
            is_arm: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          os: ${{ matrix.os }}
          preset: ${{ matrix.preset }}

      - name: Initialize Maintained Dependencies
        run: git submodule update --init ext/googletest ext/freertos vendors/arm/CMSIS_5 vendors/st/cmsis_device_f4 vendors/st/stm32f4xx_hal_driver

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4

      - name: Test
        if: ${{ !matrix.is_arm }}
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error --parallel 4 --output-junit "${{ github.workspace }}/build/${{ matrix.preset }}/ctest-results.xml"

      - name: Upload Artifacts
        if: matrix.upload_artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/bin/*
            build/${{ matrix.preset }}/lib/*
            build/${{ matrix.preset }}/generated/*
            build/${{ matrix.preset }}/CMakeCache.txt
            build/${{ matrix.preset }}/compile_commands.json
            build/${{ matrix.preset }}/ctest-results.xml
          retention-days: 7

  coverage:
    name: Coverage Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          os: ubuntu-latest
          preset: linux-gcc-coverage

      - name: Initialize Maintained Dependencies
        run: git submodule update --init ext/googletest ext/freertos vendors/arm/CMSIS_5 vendors/st/cmsis_device_f4 vendors/st/stm32f4xx_hal_driver

      - name: Configure
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          cmake --preset linux-gcc-coverage

      - name: Build
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          cmake --build --preset linux-gcc-coverage --parallel 4

      - name: Test
        run: ctest --preset linux-gcc-coverage --output-on-failure --no-tests=error --parallel 4

      - name: Generate Coverage
        run: |
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/ext/*' --output-file coverage.info
          genhtml coverage.info --output-directory coverage_html

      - name: Upload Coverage Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage_html/
          retention-days: 30

  sanitizer:
    name: ASan and UBSan service contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          os: ubuntu-latest
          preset: linux-gcc-sanitizers
      - name: Initialize Maintained Dependencies
        run: git submodule update --init ext/googletest ext/freertos vendors/arm/CMSIS_5 vendors/st/cmsis_device_f4 vendors/st/stm32f4xx_hal_driver
      - name: Configure
        run: cmake --preset linux-gcc-sanitizers
      - name: Build Contract Targets
        run: >-
          cmake --build --preset linux-gcc-sanitizers --parallel 4 --target
          osal_contract_tests baremetal_contract_tests init_registry_tests nexus_industrial_tests
          native_registry_contract_tests posix_event_contract_tests unbound_platform_contract_tests log_contract_tests
          blinky config_demo shell_demo freertos_demo nexus_industrial_controller
          crypto_tests crypto_partial_tests crypto_unconfigured_tests
          storage_tests config_persistence_tests update_tests update_storage_tests
          test_driver_stm32_spi_bare test_driver_stm32_spi_osal test_driver_stm32_gpio
      - name: Run Contract Targets
        run: >-
          ctest --preset linux-gcc-sanitizers --parallel 1 --output-on-failure --no-tests=error
          -R '^(osal_contract_tests|baremetal_contract_tests|init_registry_tests|crypto_tests|crypto_partial_tests|crypto_unconfigured_tests|storage_tests|config_persistence_tests|update_tests|update_storage_tests|driver_stm32_spi_bare|driver_stm32_spi_osal|driver_stm32_gpio|nexus_industrial_tests|native_registry_contract_tests|posix_event_contract_tests|unbound_platform_contract_tests|log_contract_tests|native_blinky_smoke|native_config_demo_smoke|native_shell_demo_smoke|native_freertos_demo_smoke|native_industrial_controller_smoke)$'
          --output-junit "${{ github.workspace }}/build/linux-gcc-sanitizers/ctest-results.xml"
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      - name: Upload Sanitizer Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanitizer-contract-evidence
          path: |
            build/linux-gcc-sanitizers/Testing/Temporary/*.log
            build/linux-gcc-sanitizers/ctest-results.xml
            build/linux-gcc-sanitizers/generated/*
          retention-days: 7
