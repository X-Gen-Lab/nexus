name: Platform Contracts

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  native:
    name: Native contracts (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [native-debug, native-release, native-asan, native-tsan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
        with:
          preset: ${{ matrix.preset }}
      - name: Configure actual target graph
        run: .venv/bin/python tools/dev/dev.py configure --preset "${{ matrix.preset }}"
      - name: Build platform and register models
        run: .venv/bin/python tools/dev/dev.py build --preset "${{ matrix.preset }}" --parallel 4
      - name: Execute the complete CTest and GoogleTest contracts once
        run: >-
          .venv/bin/python scripts/ci/native_contracts.py
          --preset "${{ matrix.preset }}"
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
      - name: Bind the upload to observed execution identity
        if: always()
        uses: ./.github/actions/record-identity
        with:
          job: native-${{ matrix.preset }}
          result: ${{ job.status }}
          expected-commit: ${{ github.sha }}
          output: build/job-identities/native-${{ matrix.preset }}
          require-dependencies: 'true'
          artifacts: |
            build/${{ matrix.preset }}/ctest-results.xml
            build/${{ matrix.preset }}/Testing/Temporary/
            build/${{ matrix.preset }}/generated/
            build/${{ matrix.preset }}/compile_commands.json
            build/${{ matrix.preset }}/tdd/
            build/${{ matrix.preset }}/google-contracts.json
          tools: |
            python=python3
            cmake=cmake
            compiler=cc
      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contracts-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/ctest-results.xml
            build/${{ matrix.preset }}/Testing/Temporary/
            build/${{ matrix.preset }}/generated/
            build/${{ matrix.preset }}/compile_commands.json
            build/${{ matrix.preset }}/tdd/
            build/${{ matrix.preset }}/google-contracts.json
            build/job-identities/native-${{ matrix.preset }}/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error

  arch:
    name: Cortex-M compiler and runtime contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
        with:
          preset: native-debug
          arm: 'true'
      - name: Audit real objects and atomics for nine Cortex-M profiles
        run: >-
          .venv/bin/python scripts/ci/arch_compile.py
          --root "$GITHUB_WORKSPACE"
          --compiler arm-none-eabi-gcc
          --output build/arch-compiler
      - name: Link all CPU runtime and kernel ABI profiles
        run: >-
          .venv/bin/python scripts/ci/cortex_runtime.py
          --root "$GITHUB_WORKSPACE"
          --compiler arm-none-eabi-gcc
          --output build/cortex-runtime
      - name: Verify explicit kernel profiles and missing hook rejection
        run: >-
          .venv/bin/python scripts/ci/os_profiles.py
          --output build/os-profiles
      - name: Compare actual wait ABI RAM and instruction costs
        run: >-
          .venv/bin/python scripts/ci/os_wait_cost.py
          --output build/os-wait-cost
      - name: Measure actual static OS objects and retained service paths
        run: >-
          .venv/bin/python scripts/ci/os_resources.py
          --output build/os-resources
      - name: Verify F407 default and selected CCM startup images
        run: >-
          .venv/bin/python scripts/ci/stm32_memory.py
          --output build/stm32-memory
      - name: Verify GD default and optional RAM startup images
        run: >-
          .venv/bin/python scripts/ci/gd32_memory.py
          --output build/gd32-memory
      - name: Bind the upload to observed execution identity
        if: always()
        uses: ./.github/actions/record-identity
        with:
          job: arch
          result: ${{ job.status }}
          expected-commit: ${{ github.sha }}
          output: build/job-identities/arch
          require-dependencies: 'true'
          artifacts: |
            build/arch-compiler/
            build/cortex-runtime/
            build/os-profiles/
            build/os-wait-cost/
            build/os-resources/
            build/stm32-memory/
            build/gd32-memory/
          tools: |
            python=python3
            compiler=arm-none-eabi-gcc
      - name: Preserve compiler evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cortex-m-primitive-compiler
          path: |
            build/arch-compiler/
            build/cortex-runtime/
            build/os-profiles/
            build/os-wait-cost/
            build/os-resources/
            build/stm32-memory/
            build/gd32-memory/
            build/job-identities/arch/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
      # CPU reference links do not qualify a physical SoC, Board or hardware.

  threadx:
    name: ThreadX kernel and lifecycle software contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
        with:
          preset: native-debug
          arm: 'true'
      - name: Link all reviewed Boards and both kernel interrupt policies
        run: >-
          .venv/bin/python scripts/ci/os_threadx.py
          --compiler arm-none-eabi-gcc
          --output build/os-threadx
      - name: Bind the upload to observed execution identity
        if: always()
        uses: ./.github/actions/record-identity
        with:
          job: threadx
          result: ${{ job.status }}
          expected-commit: ${{ github.sha }}
          output: build/job-identities/threadx
          require-dependencies: 'true'
          artifacts: |
            build/os-threadx/
          tools: |
            python=python3
            cmake=cmake
            compiler=arm-none-eabi-gcc
      - name: Preserve ThreadX execution
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: threadx-kernel-contracts
          path: |
            build/os-threadx/
            build/job-identities/threadx/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
      # Kernel links establish software contracts; physical execution is separate.

  os-security:
    name: Optional MPU and TrustZone software contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
        with:
          preset: native-debug
          arm: 'true'
      - name: Link real MPU ports and audit privilege domains
        run: >-
          .venv/bin/python scripts/ci/os_mpu.py
          --compiler arm-none-eabi-gcc
          --output build/os-mpu
      - name: Link Secure and Nonsecure images through actual CMSE imports
        run: >-
          .venv/bin/python scripts/ci/os_secure_runtime.py
          --compiler arm-none-eabi-gcc
          --output build/os-secure-runtime
      - name: Bind the upload to observed execution identity
        if: always()
        uses: ./.github/actions/record-identity
        with:
          job: os-security
          result: ${{ job.status }}
          expected-commit: ${{ github.sha }}
          output: build/job-identities/os-security
          require-dependencies: 'true'
          artifacts: |
            build/os-mpu/
            build/os-secure-runtime/
          tools: |
            python=python3
            compiler=arm-none-eabi-gcc
      - name: Preserve security link evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: os-security-link-contracts
          path: |
            build/os-mpu/
            build/os-secure-runtime/
            build/job-identities/os-security/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
      # CPU software fixtures establish linkage and ownership. Physical fault
      # injection, SAU/IDAU wiring and isolation remain station qualification.

  arm:
    name: ARM link and budgets (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset:
          - stm32-qiming-baremetal
          - stm32-qiming-freertos
          - stm32-sky-baremetal
          - stm32-sky-freertos
          - gd32-liangshan-baremetal
          - gd32-liangshan-freertos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
        with:
          preset: ${{ matrix.preset }}
          arm: 'true'
      - name: Configure the selected static assembly
        run: .venv/bin/python tools/dev/dev.py configure --preset "${{ matrix.preset }}"
      - name: Link the actual reset vector and selected providers
        run: >-
          .venv/bin/python tools/dev/dev.py build --preset "${{ matrix.preset }}"
          --parallel 4 --target nexus_firmware nexus_bus_owner nexus_spi_owner
          nexus_uart_owner nexus_bmp280 nexus_bmp280_spi nexus_log nexus_storage
          nexus_flash_storage nexus_modbus
      - name: Verify physical memory and configuration identity
        run: >-
          .venv/bin/python tools/measurement/resources.py
          --elf build/${{ matrix.preset }}/bin/nexus_firmware.elf
          --resolved build/${{ matrix.preset }}/generated/resolved.json
          --budget build/${{ matrix.preset }}/generated/resource-budget.json
          --report build/${{ matrix.preset }}/resource-report.json
      - name: Prepare the unbound physical station work plan
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          case "$PRESET" in
            stm32-qiming-*) fixture=stm32f407_qiming_v31 ;;
            stm32-sky-*) fixture=stm32f407ve_sky_qingchun ;;
            gd32-liangshan-*) fixture=gd32f470_liangshan ;;
            *) exit 1 ;;
          esac
          .venv/bin/python -B tools/hil/prepare.py \
            --fixture "tools/hil/fixtures/$fixture.json" \
            --resolved "build/$PRESET/generated/resolved.json" \
            --report "build/$PRESET/hil-preparation.json"
      - name: Bind the upload to observed execution identity
        if: always()
        uses: ./.github/actions/record-identity
        with:
          job: arm-${{ matrix.preset }}
          result: ${{ job.status }}
          expected-commit: ${{ github.sha }}
          output: build/job-identities/arm-${{ matrix.preset }}
          require-dependencies: 'true'
          artifacts: |
            build/${{ matrix.preset }}/bin/
            build/${{ matrix.preset }}/generated/
            build/${{ matrix.preset }}/compile_commands.json
            build/${{ matrix.preset }}/resource-report.json
            build/${{ matrix.preset }}/hil-preparation.json
          tools: |
            python=python3
            cmake=cmake
            compiler=arm-none-eabi-gcc
      - name: Preserve linked software evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: software-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/bin/
            build/${{ matrix.preset }}/generated/
            build/${{ matrix.preset }}/compile_commands.json
            build/${{ matrix.preset }}/resource-report.json
            build/${{ matrix.preset }}/hil-preparation.json
            build/job-identities/arm-${{ matrix.preset }}/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
      # ARM linking and modeled peripheral tests establish software contracts.
      # Probe/serial execution and physical timing remain separate HIL evidence.

  controller-routes:
    name: Provider assembly audits (${{ matrix.fixture }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - stm32_assembly
          - gd32_assembly
          - can_assembly
          - usb_assembly
          - ethernet_assembly
          - timer_assembly
          - g474_assembly
          - multi_controller_assembly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
        with:
          preset: native-debug
          arm: 'true'
      - name: Link and audit each authored software assembly
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          fixture="tests/contracts/$FIXTURE"
          arguments=()
          for assembly in "$fixture"/*.toml; do
            arguments+=(--fixture "$assembly")
          done
          .venv/bin/python scripts/ci/provider_assemblies.py \
            --root "$GITHUB_WORKSPACE" \
            --compiler arm-none-eabi-gcc \
            --output "build/controller-routes/$FIXTURE" \
            --parallel 4 "${arguments[@]}"
      - name: Bind the upload to observed execution identity
        if: always()
        uses: ./.github/actions/record-identity
        with:
          job: routes-${{ matrix.fixture }}
          result: ${{ job.status }}
          expected-commit: ${{ github.sha }}
          output: build/job-identities/routes-${{ matrix.fixture }}
          require-dependencies: 'true'
          artifacts: |
            build/controller-routes/
          tools: |
            python=python3
            cmake=cmake
            compiler=arm-none-eabi-gcc
      - name: Retain the actual peripheral link and budget evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controller-software-${{ matrix.fixture }}
          path: |
            build/controller-routes/
            build/job-identities/routes-${{ matrix.fixture }}/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
      # These fixtures exercise real providers and static constructors. They
      # declare unknown PCB revisions; they do not assert three-board wiring.
