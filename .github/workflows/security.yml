name: Security Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependency-audit:
    name: Audit resolved Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Resolve project dependencies and isolate the scanner
        run: |
          python -m pip install -r dependencies/environment-tools.txt -r dependencies/development-tools.txt
          python -m pip freeze > resolved-python.txt
          python -m venv .audit-tools
          .audit-tools/bin/python -m pip install pip-audit==2.9.0
      - name: Audit the actual resolved project environment
        run: |
          .audit-tools/bin/pip-audit --requirement resolved-python.txt \
            --no-deps --disable-pip --format json --output pip-audit.json
          test -s pip-audit.json
      - name: Preserve scanner evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dependency-audit
          path: |
            resolved-python.txt
            pip-audit.json
          if-no-files-found: error
          retention-days: 30

  codeql:
    name: CodeQL analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Bound the complete C++ extraction and security query execution.
    timeout-minutes: ${{ matrix.language == 'cpp' && 90 || 45 }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [cpp, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: ${{ matrix.language == 'cpp' && (github.event_name == 'push' || github.event_name == 'pull_request') && '0' || '1' }}
      - name: Prove whether the C++ input changed
        id: cpp-scope
        if: matrix.language == 'cpp' && (github.event_name == 'push' || github.event_name == 'pull_request')
        env:
          GIT_NO_REPLACE_OBJECTS: '1'
          NEXUS_CHANGE_EVENT: ${{ github.event_name }}
          NEXUS_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          NEXUS_CHANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          NEXUS_CHANGE_CHECKOUT: ${{ github.sha }}
        run: |
          if [[ "$NEXUS_CHANGE_BASE" =~ ^[0-9a-f]{40}$ ]] && policy=$(mktemp); then
            trap 'rm -f "$policy"' EXIT
            if git cat-file blob "$NEXUS_CHANGE_BASE:tools/dev/change_paths.py" > "$policy" &&
               python3 -I "$policy" --codeql --github-output "$GITHUB_OUTPUT"; then
              exit 0
            fi
          fi
          echo 'Git input proof unavailable. The complete C++ analysis will run.'
          echo 'skip_cpp=false' >> "$GITHUB_OUTPUT"
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: matrix.language == 'python' || steps.cpp-scope.outputs.skip_cpp != 'true'
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/config.yml
          queries: security-and-quality
          build-mode: ${{ matrix.language == 'cpp' && 'manual' || 'none' }}
      - name: Configure native compiler environment
        if: matrix.language == 'cpp' && steps.cpp-scope.outputs.skip_cpp != 'true'
        uses: ./.github/actions/setup-build
        with:
          os: ubuntu-latest
          preset: native-debug
          arm: 'true'
      - name: Trace the actual native build
        if: matrix.language == 'cpp' && steps.cpp-scope.outputs.skip_cpp != 'true'
        run: |
          .venv/bin/python tools/dev/dev.py configure --preset native-debug
          NEXUS_COMMAND_TIMEOUT=3600 .venv/bin/python tools/dev/dev.py build --preset native-debug --parallel 2
          test -s build/native-debug/compile_commands.json
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: matrix.language == 'python' || steps.cpp-scope.outputs.skip_cpp != 'true'
        with:
          category: /language:${{ matrix.language }}
          upload: true
      # Extraction/upload is execution evidence; findings still need triage.
      # This job does not assert that the product has zero vulnerabilities.
      - name: Report the reviewed C++ scope decision
        if: matrix.language == 'cpp' && steps.cpp-scope.outputs.skip_cpp == 'true'
        run: echo 'C++ analysis skipped because the checked Git changes only edit reviewed prose.' >> "$GITHUB_STEP_SUMMARY"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect verified and unknown secret candidates
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -B scripts/ci/secret_scan.py \
            --source "$GITHUB_WORKSPACE" --base "$SCAN_BASE" --head "$SCAN_HEAD" \
            --report secret-scan-report.json
      # Exact archive and binary SHA pin 3.99.1. Only reviewed negative-test
      # unknowns with matching Raw/context hashes and Git path may pass.
      # Verified candidates and scanner failures remain blocking. No raw
      # credentials or verification errors are printed or uploaded.
      - name: Preserve redacted scanner decision
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secret-scan-decision
          path: secret-scan-report.json
          if-no-files-found: error
          retention-days: 30
