name: Resource Profiles

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profiles:
    name: Linked costs (${{ matrix.board }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: qiming
            workloads: empty gpio uart
          - board: sky
            workloads: empty gpio uart
          - board: liangshan
            workloads: empty gpio uart spi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
        with:
          preset: resource-profiles
          arm: 'true'
      - name: Measure real minimum workloads and fail budget violations
        run: >-
          .venv/bin/python tools/measurement/compare.py
          --assembly tools/configure/assemblies/${{ matrix.board }}-baremetal.toml
          --build-root build/profiles-${{ matrix.board }}
          --compiler "$(command -v arm-none-eabi-gcc)"
          --cmake .venv/bin/cmake --ninja .venv/bin/ninja
          --workloads ${{ matrix.workloads }}
      - name: Preserve profile identity, maps and actual costs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resource-profiles-${{ matrix.board }}
          path: build/profiles-${{ matrix.board }}/
          if-no-files-found: error
          retention-days: 30
      # SPI board profiles are limited to maintained wiring. No measured
      # MCU cycles, IRQ latency, dynamic high-water or power-loss claim is made.
