name: Resource Evidence

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract-runtime:
    name: Host contract execution timings (not MCU real-time evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-build
        with:
          os: ubuntu-latest
          preset: linux-gcc-release
      - name: Build Release contracts
        run: |
          cmake --preset linux-gcc-release
          cmake --build --preset linux-gcc-release --parallel 2
      - name: Execute all host contracts, reject zero tests
        run: |
          ctest --preset linux-gcc-release --no-tests=error \
            --output-junit "${{ github.workspace }}/build/linux-gcc-release/runtime-results.xml"
          python -c "from pathlib import Path; from scripts.evidence.build_inventory import test_summary; print(test_summary(Path('build/linux-gcc-release/runtime-results.xml')))"
      - name: Retain measured host runtimes and configuration
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-contract-runtime
          path: |
            build/linux-gcc-release/runtime-results.xml
            build/linux-gcc-release/generated/
            build/linux-gcc-release/Testing/Temporary/LastTest.log
          if-no-files-found: error
          retention-days: 90

  memory-check:
    name: Native Valgrind contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-build
        with:
          os: ubuntu-latest
          preset: linux-gcc-debug
      - name: Install maintained memory checker
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Build native contracts
        run: |
          cmake --preset linux-gcc-debug
          cmake --build --preset linux-gcc-debug --parallel 2
      - name: Check every executed contract and reject tool errors
        run: |
          python scripts/evidence/resource_checks.py memory \
            --build build/linux-gcc-debug --report build/linux-gcc-debug/memory-report.json
      - name: Retain memory execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-memory-check
          path: |
            build/linux-gcc-debug/memory-report.json
            build/linux-gcc-debug/memory-logs/
            build/linux-gcc-debug/generated/
          if-no-files-found: error
          retention-days: 90

  arm-size:
    name: STM32F407 linked image size (hardware timing pending)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-stm32-armgcc-release, stm32-armgcc-freertos-release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-build
        with:
          os: ubuntu-latest
          preset: ${{ matrix.preset }}
      - name: Build the target image
        run: |
          cmake --preset "${{ matrix.preset }}"
          cmake --build --preset "${{ matrix.preset }}" --parallel 2
      - name: Measure actual linked sections, reject missing images/tools
        run: |
          python scripts/evidence/resource_checks.py size \
            --build "build/${{ matrix.preset }}" \
            --report "build/${{ matrix.preset }}/size-report.json"
      - name: Retain section measurements and map evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arm-size-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/size-report.json
            build/${{ matrix.preset }}/bin/*.elf
            build/${{ matrix.preset }}/bin/*.map
            build/${{ matrix.preset }}/generated/
          if-no-files-found: error
          retention-days: 90
