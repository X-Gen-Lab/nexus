name: Formal Software Plan

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Formal qualification plan or inspection and transport of one run
        type: choice
        required: true
        default: formal
        options:
          - formal
          - diagnostics
      expected_commit:
        description: Exact main SHA; must equal the source and workflow commit
        type: string
        required: false
      run_id:
        description: Diagnostics only; original formal workflow run ID
        type: string
        required: false
      attempt:
        description: Diagnostics only; original completed run attempt
        type: string
        required: false
      expected_source:
        description: Diagnostics only; exact original 40-character source SHA
        type: string
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: formal-software-${{ inputs.mode || 'formal' }}-${{ inputs.expected_commit || inputs.run_id }}-${{ inputs.attempt }}
  cancel-in-progress: false

jobs:
  formal:
    if: inputs.mode == 'formal' || inputs.mode == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      NEXUS_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      NEXUS_WORKFLOW_SHA: ${{ github.workflow_sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      NEXUS_BUILD_JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CTEST_PARALLEL_LEVEL: '1'
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - name: Require manual main and the exact source and workflow SHA
        id: request
        env:
          F: ${{ runner.temp }}/formal
        run: |
          echo "F=$F" >> "$GITHUB_ENV"
          mkdir "$F"
          exec > >(tee "$F/request.raw") 2>&1
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          names = ('GITHUB_EVENT_NAME', 'GITHUB_REF', 'GITHUB_SHA',
                   'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT',
                   'NEXUS_EXPECTED_COMMIT', 'NEXUS_WORKFLOW_SHA')
          context = {name: os.environ.get(name, '') for name in names}
          expected = context['NEXUS_EXPECTED_COMMIT']
          accepted = (context['GITHUB_EVENT_NAME'] == 'workflow_dispatch' and
              context['GITHUB_REF'] == 'refs/heads/main' and
              re.fullmatch('[0-9a-f]{40}', expected) is not None and
              expected == context['GITHUB_SHA'] == context['NEXUS_WORKFLOW_SHA'])
          (Path(os.environ['F']) / 'request.json').write_text(json.dumps({
              'context': context, 'accepted': accepted,
              'software_qualified': False, 'physical_status': 'not_executed'},
              indent=2) + '\n')
          if not accepted:
              raise SystemExit('Manual main and identical exact SHA required')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Verify the actual clean checkout before preparation
        id: source
        run: |
          exec > >(tee "$F/source.raw") 2>&1
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          source = {'commit': git('rev-parse', 'HEAD'),
                    'tree': git('rev-parse', 'HEAD^{tree}'),
                    'dirty': bool(git('status', '--porcelain', '--untracked-files=all'))}
          (Path(os.environ['F']) / 'source.json').write_text(
              json.dumps(source, indent=2) + '\n')
          if source['commit'] != os.environ['NEXUS_EXPECTED_COMMIT'] or source['dirty']:
              raise SystemExit('Actual checkout must be exact and clean')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('validated=true\n')
          PY
      - uses: ./.github/actions/setup-build
        id: setup
        with:
          preset: native-debug
          arm: 'true'
      - name: Install the existing analyzers for the unchanged plan
        id: analyzers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-14 cppcheck
          echo /usr/lib/llvm-14/bin >> "$GITHUB_PATH"
      - name: Observe available resources and reject reused build outputs
        id: resources
        run: |
          exec > >(tee "$F/resources.raw") 2>&1
          uname -a
          df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          free -b
          .venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          from tools.dev.presets import binary_directory
          from tools.evidence.common import load_json
          root = Path(os.environ['GITHUB_WORKSPACE'])
          plan = load_json(root / 'tools/dev/plans/software.json')
          presets = {stage['args'][stage['args'].index('--preset') + 1]
                     for stage in plan['stages'] if '--preset' in stage['args']}
          if any(binary_directory(root, preset).exists() for preset in presets):
              raise SystemExit('Formal execution requires fresh preset build roots')
          if (Path(os.environ['F']) / 'software').exists():
              raise SystemExit('Formal plan output must be new')
          PY
      - name: Execute the complete maintained software plan once
        id: software
        run: |
          .venv/bin/python - <<'PY'
          import os, sys
          from pathlib import Path
          from tools.dev.process import run
          root = Path(os.environ['GITHUB_WORKSPACE'])
          result = run([sys.executable, '-B', 'tools/dev/qualification.py',
              '--root', str(root), '--plan', 'tools/dev/plans/software.json',
              '--output', str(Path(os.environ['F']) / 'software')],
              cwd=root, env=os.environ.copy(), timeout=18000,
              log=root / 'build/quality/formal-software.raw', stage='formal-software')
          print(result.stdout, end='')
          print(result.stderr, end='', file=sys.stderr)
          raise SystemExit(result.returncode)
          PY
      - name: Observe original stage reports and missing command receipts
        id: stage_metadata
        if: >-
          always() && (steps.software.outcome == 'success' ||
          steps.software.outcome == 'failure' || steps.software.outcome == 'cancelled')
        env:
          NEXUS_SOFTWARE_OUTCOME: ${{ steps.software.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          source = Path(os.environ['F']) / 'software'
          report = source / 'report.json'
          record = {'source_commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'software_step_outcome': os.environ['NEXUS_SOFTWARE_OUTCOME'],
              'software_qualified': False, 'physical_status': 'not_executed',
              'scope': 'Original stage metadata; not qualification or replacement stores',
              'files': [], 'missing': [], 'errors': []}
          report_bytes = None
          for path in sorted({report, *source.glob('*.command.json')}):
              if path.is_symlink() or not path.is_file():
                  record['missing'].append(path.name)
                  continue
              try:
                  data = path.read_bytes()
              except OSError as error:
                  record['errors'].append(f'{path.name}: {error}')
                  continue
              record['files'].append({'path': path.name, 'size': len(data),
                  'sha256': hashlib.sha256(data).hexdigest()})
              if path == report:
                  report_bytes = data
          if report_bytes is not None:
              try:
                  original = json.loads(report_bytes)
                  record['original_report_status'] = original['status']
                  available = {item['path'] for item in record['files']}
                  for stage in original['stages']:
                      name = stage['name']
                      if (not isinstance(name, str) or not name or
                              name in ('.', '..') or '/' in name or '\\' in name):
                          raise ValueError('Invalid original stage name')
                      expected = name + '.command.json'
                      if expected not in available:
                          record['missing'].append(expected)
              except (KeyError, TypeError, ValueError) as error:
                  record['errors'].append(f'report.json: {error}')
          complete = not record['missing'] and not record['errors']
          record['metadata_status'] = 'complete' if complete else 'incomplete'
          (Path(os.environ['RUNNER_TEMP']) / 'formal-stage-metadata.json').write_text(
              json.dumps(record, indent=2) + '\n')
          if not complete:
              raise SystemExit('Original stage metadata is missing or invalid')
          PY
      - name: Retain stage status and timing before complete archive transfer
        id: stage_metadata_upload
        if: >-
          always() && (steps.software.outcome == 'success' ||
          steps.software.outcome == 'failure' || steps.software.outcome == 'cancelled')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-software-stages-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/formal/software/report.json
            ${{ runner.temp }}/formal/software/*.command.json
            ${{ runner.temp }}/formal-stage-metadata.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Preserve the complete temporary output with the existing verifier
        id: formal_archive
        if: always() && steps.source.outputs.validated == 'true'
        run: >-
          python3 -B tools/evidence/store.py export
          --source "$F" --store build/formal-transfer/store
          --report build/formal-transfer/formal-package.json
      - name: Bind the original build tree and temporary-output archive
        id: identity
        if: always() && steps.source.outputs.validated == 'true'
        uses: ./.github/actions/record-identity
        with:
          job: formal-software
          result: ${{ job.status }}
          expected-commit: ${{ inputs.expected_commit }}
          output: build/job-identities/formal-software
          require-dependencies: 'true'
          artifacts: build/
          tools: |
            python=python3
            cmake=cmake
            native=cc
            native-cxx=c++
            compiler=arm-none-eabi-gcc
            tidy=clang-tidy
            cppcheck=cppcheck
      - name: Preserve the complete build tree and observed job identity
        id: build_archive
        if: always() && steps.source.outputs.validated == 'true'
        run: >-
          python3 -B tools/evidence/store.py export
          --source build --store "$RUNNER_TEMP/formal-build-store"
          --report "$RUNNER_TEMP/formal-build-package.json"
      - name: Record actual execution and preservation outcomes
        id: diagnostics
        if: always()
        env:
          NEXUS_FORMAL_STEPS: ${{ toJSON(steps) }}
          NEXUS_FORMAL_RESULT: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          steps = json.loads(os.environ['NEXUS_FORMAL_STEPS'])
          names = ('request', 'checkout', 'source', 'setup', 'analyzers',
                   'resources', 'software', 'formal_archive', 'identity', 'build_archive')
          record = {'job_result_before_upload': os.environ['NEXUS_FORMAL_RESULT'],
              'steps': {name: {key: steps.get(name, {}).get(key)
                        for key in ('outcome', 'conclusion')} for name in names},
              'software_qualified': False, 'physical_status': 'not_executed',
              'scope': 'plan orchestration only; candidate qualification is separate'}
          (Path(os.environ['RUNNER_TEMP']) / 'formal-diagnostics.json').write_text(
              json.dumps(record, indent=2) + '\n')
          PY
      - name: Retain the complete verified archive
        id: archive_upload
        if: always() && steps.build_archive.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-software-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/formal-build-store/
            ${{ runner.temp }}/formal-build-package.json
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Preserve original trees if verified archiving did not complete
        id: fallback_upload
        if: >-
          always() && (steps.formal_archive.outcome != 'success' ||
          steps.build_archive.outcome != 'success' || steps.archive_upload.outcome != 'success')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-software-unqualified-raw-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/formal/
            build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain execution diagnostics independently
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-software-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/formal-diagnostics.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      # A complete executed plan is not a software candidate or physical HIL.
      # Cancellation uploads are best effort; archive verification and actual
      # GitHub upload/run outcomes must be checked before evidence is admitted.

  diagnostics:
    if: inputs.mode == 'diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      NEXUS_TARGET_RUN: ${{ inputs.run_id }}
      NEXUS_TARGET_ATTEMPT: ${{ inputs.attempt }}
      NEXUS_EXPECTED_SOURCE: ${{ inputs.expected_source }}
      NEXUS_WORKFLOW_SHA: ${{ github.workflow_sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Verify the original completed run and exact retained artifact
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          D: ${{ runner.temp }}/formal-inspection
        run: |
          echo "D=$D" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          output = Path(os.environ['D']) / 'request'
          output.mkdir(parents=True, exist_ok=False)
          run_id = os.environ['NEXUS_TARGET_RUN']
          attempt = os.environ['NEXUS_TARGET_ATTEMPT']
          expected = os.environ['NEXUS_EXPECTED_SOURCE']
          repository = os.environ['GITHUB_REPOSITORY']
          record = {'accepted': False, 'software_qualified': False,
              'physical_status': 'not_executed', 'run_id': run_id,
              'run_attempt': attempt, 'expected_source': expected,
              'diagnostic_source': os.environ['GITHUB_SHA'],
              'scope': 'Inspect original bytes; do not execute or qualify a plan'}
          def api(path, *, pages=False):
              args = ['gh', 'api']
              if pages:
                  args += ['--paginate', '--slurp']
              return json.loads(subprocess.check_output(
                  args + [path], text=True, timeout=60))
          def save(name, value):
              (output / name).write_text(json.dumps(value, indent=2) + '\n')
          try:
              if (os.environ['GITHUB_EVENT_NAME'] != 'workflow_dispatch' or
                      os.environ['GITHUB_SHA'] != os.environ['NEXUS_WORKFLOW_SHA'] or
                      not re.fullmatch('[1-9][0-9]*', run_id) or
                      not re.fullmatch('[1-9][0-9]*', attempt) or
                      not re.fullmatch('[0-9a-f]{40}', expected)):
                  raise ValueError('Manual dispatch and exact source/run/attempt required')
              path = f'repos/{repository}/actions/runs/{run_id}'
              run = api(path + f'/attempts/{attempt}')
              save('original-run.json', run)
              record['source_conclusion'] = run.get('conclusion')
              if (run.get('id') != int(run_id) or
                      run.get('run_attempt') != int(attempt) or
                      run.get('head_sha') != expected or
                      run.get('repository', {}).get('full_name') != repository or
                      run.get('path') != '.github/workflows/formal-software.yml' or
                      run.get('event') != 'workflow_dispatch' or
                      run.get('head_branch') != 'main' or
                      run.get('status') != 'completed' or
                      run.get('conclusion') not in ('success', 'failure')):
                  raise ValueError('Original run must be the exact completed formal attempt')
              pages = api(path + '/artifacts?per_page=100', pages=True)
              save('original-artifacts.json', pages)
              name = f'formal-software-{expected}-{run_id}-{attempt}'
              matches = [artifact for page in pages for artifact in page['artifacts']
                         if artifact.get('name') == name]
              if len(matches) != 1:
                  raise ValueError('Exactly one original verified archive artifact required')
              artifact = matches[0]
              origin = artifact.get('workflow_run', {})
              if (artifact.get('expired') is not False or
                      not isinstance(artifact.get('id'), int) or artifact['id'] <= 0 or
                      not isinstance(artifact.get('size_in_bytes'), int) or
                      artifact['size_in_bytes'] <= 0 or
                      origin.get('id') != int(run_id) or
                      origin.get('head_sha') != expected):
                  raise ValueError('Retained artifact source/run or availability mismatch')
              record.update(accepted=True, artifact=artifact)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
                  stream.write(f"artifact_id={artifact['id']}\n")
          except Exception as error:
              record['error'] = str(error)
              raise SystemExit(str(error)) from error
          finally:
              save('selection.json', record)
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Download only the selected original artifact
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.request.outputs.artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          path: ${{ runner.temp }}/formal-inspection/artifact
          merge-multiple: true
          digest-mismatch: error
      - name: Verify complete original stores and prepare bounded diagnostics
        id: extract
        run: |
          python3 -B tools/evidence/formal_diagnostics.py \
            --artifact "$D/artifact" --output "$D/result" \
            --expected-commit "$NEXUS_EXPECTED_SOURCE" \
            --run-id "$NEXUS_TARGET_RUN" \
            --run-attempt "$NEXUS_TARGET_ATTEMPT" \
            2>&1 | tee "$D/request/extract.raw"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads((Path(os.environ['D']) /
              'result/transport/manifest.json').read_text())
          parts = manifest['parts']
          if (not 1 <= len(parts) <= 16 or
                  [part['name'] for part in parts] !=
                  [f'part-{index:03}' for index in range(len(parts))]):
              raise SystemExit('Expected one to sixteen consecutive archive parts')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'part_count={len(parts)}\n')
          PY
      - name: Retain small diagnostics and original API observations
        id: diagnostics_upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-inspection-${{ inputs.run_id }}-${{ inputs.attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/formal-inspection/request/
            ${{ runner.temp }}/formal-inspection/result/diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain the original envelope and ordered part manifest
        id: transport_upload
        if: always() && steps.extract.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-inspection-transport-${{ inputs.run_id }}-${{ inputs.attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/formal-inspection/result/transport/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      # Each 450 MiB part is a separate artifact below the 512 MiB connector
      # limit. Do not upload the original archive or parts directory as a unit.
      - name: Retain archive part 000
        id: part_000
        if: always() && steps.extract.outcome == 'success' && fromJSON(steps.extract.outputs.part_count) > 0
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-inspection-part-000-${{ inputs.run_id }}-${{ inputs.attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/formal-inspection/result/parts/part-000
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain archive part 001
        id: part_001
        if: always() && steps.extract.outcome == 'success' && fromJSON(steps.extract.outputs.part_count) > 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-inspection-part-001-${{ inputs.run_id }}-${{ inputs.attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/formal-inspection/result/parts/part-001
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain archive part 002
        id: part_002
        if: always() && steps.extract.outcome == 'success' && fromJSON(steps.extract.outputs.part_count) > 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-inspection-part-002-${{ inputs.run_id }}-${{ inputs.attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/formal-inspection/result/parts/part-002
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain archive part 003
        id: part_003
        if: always() && steps.extract.outcome == 'success' && fromJSON(steps.extract.outputs.part_count) > 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-inspection-part-003-${{ inputs.run_id }}-${{ inputs.attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/formal-inspection/result/parts/part-003
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain archive part 004
        id: part_004
        if: always() && steps.extract.outcome == 'success' && fromJSON(steps.extract.outputs.part_count) > 4
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-inspection-part-004-${{ inputs.run_id }}-${{ inputs.attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/formal-inspection/result/parts/part-004
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain archive part 005
        id: part_005
        if: always() && steps.extract.outcome == 'success' && fromJSON(steps.extract.outputs.part_count) > 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-inspection-part-005-${{ inputs.run_id }}-${{ inputs.attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/formal-inspection/result/parts/part-005
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain archive part 006
        id: part_006
        if: always() && steps.extract.outcome == 'success' && fromJSON(steps.extract.outputs.part_count) > 6
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-inspection-part-006-${{ inputs.run_id }}-${{ inputs.attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/formal-inspection/result/parts/part-006
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
