name: Release Candidate

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag matching the selected source commit (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate Release Source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      commit: ${{ steps.validate.outputs.commit }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Validate version and tag commit
        id: validate
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: python3 scripts/ci/package_release.py metadata --version "$RELEASE_VERSION"

  build-release:
    name: Build ${{ matrix.name }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            preset: linux-gcc-release
            artifact: nexus-linux-gcc
            host_tests: true
          - name: STM32F407 Baremetal
            os: ubuntu-latest
            preset: stm32-armgcc-release
            artifact: nexus-stm32f407-baremetal
            host_tests: false
          - name: STM32F407 FreeRTOS
            os: ubuntu-latest
            preset: stm32-armgcc-freertos-release
            artifact: nexus-stm32f407-freertos
            host_tests: false
          - name: Qiming STM32F407ZG Baremetal
            os: ubuntu-latest
            preset: stm32-qiming-armgcc-baremetal-release
            artifact: nexus-stm32f407-qiming-baremetal
            host_tests: false
          - name: Qiming STM32F407ZG FreeRTOS
            os: ubuntu-latest
            preset: stm32-qiming-armgcc-freertos-release
            artifact: nexus-stm32f407-qiming-freertos
            host_tests: false
          - name: Sky STM32F407VE Baremetal
            os: ubuntu-latest
            preset: stm32-sky-armgcc-baremetal-release
            artifact: nexus-stm32f407-sky-baremetal
            host_tests: false
          - name: Sky STM32F407VE FreeRTOS
            os: ubuntu-latest
            preset: stm32-sky-armgcc-freertos-release
            artifact: nexus-stm32f407-sky-freertos
            host_tests: false
          - name: Liangshan GD32F470ZG Baremetal
            os: ubuntu-latest
            preset: gd32f470-armgcc-baremetal-release
            artifact: nexus-gd32f470-liangshan-baremetal
            host_tests: false
          - name: Liangshan GD32F470ZG FreeRTOS
            os: ubuntu-latest
            preset: gd32f470-armgcc-freertos-release
            artifact: nexus-gd32f470-liangshan-freertos
            host_tests: false
    env:
      BUILD_PRESET: ${{ matrix.preset }}
      RELEASE_ARTIFACT: ${{ matrix.artifact }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      SOURCE_COMMIT: ${{ needs.metadata.outputs.commit }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Setup Build Environment
        uses: ./.github/actions/setup-build
        with:
          os: ${{ matrix.os }}
          preset: ${{ matrix.preset }}
      - name: Install locked ARM compiler for source SDK relocation contracts
        if: matrix.host_tests
        run: |
          python3 scripts/ci/install_arm_toolchain.py --install-dir "$RUNNER_TEMP/nexus-arm-toolchain"
          echo "$RUNNER_TEMP/nexus-arm-toolchain/bin" >> "$GITHUB_PATH"
      - name: Initialize Maintained Dependencies
        run: |
          case "$BUILD_PRESET" in
            linux-gcc-release)
              git submodule update --init --recursive ext/googletest ext/freertos vendors/arm/CMSIS_5 vendors/st/cmsis_device_f4 vendors/st/stm32f4xx_hal_driver
              ;;
            gd32f470-*)
              python3 scripts/ci/verify_vendor_source.py --root vendors/gigadevice/gd32f4xx
              ;;
            stm32-*)
              git submodule update --init vendors/arm/CMSIS_5 vendors/st/cmsis_device_f4 vendors/st/stm32f4xx_hal_driver
              ;;
            *) exit 1 ;;
          esac
          if [[ "$BUILD_PRESET" == *freertos-release ]]; then
            git submodule update --init --recursive ext/freertos
          fi
      - name: Configure
        run: cmake --preset "$BUILD_PRESET"
      - name: Build
        run: cmake --build --preset "$BUILD_PRESET" --parallel 4
      - name: Validate actual ARM vectors, registration ABI and physical memory
        if: ${{ !matrix.host_tests }}
        run: >-
          python3 scripts/ci/validate_firmware_elf.py
          --build-dir "build/$BUILD_PRESET"
          --report "build/$BUILD_PRESET/firmware-static-contract.json"
      - name: Test Native platform contracts and verify fresh JUnit
        if: matrix.host_tests
        run: python3 scripts/ci/ci_build.py --preset "$BUILD_PRESET" --stage test --jobs 4
      - name: Package compiled outputs and provenance
        run: |
          python3 scripts/ci/package_release.py package \
            --version "$RELEASE_VERSION" --source-commit "$SOURCE_COMMIT" \
            --preset "$BUILD_PRESET" --artifact "$RELEASE_ARTIFACT" \
            --build-dir "build/$BUILD_PRESET" --output-dir release
      - name: Stage candidate assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.artifact }}
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Retain Build and Test Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.artifact }}
          path: |
            build/${{ matrix.preset }}/CMakeCache.txt
            build/${{ matrix.preset }}/compile_commands.json
            build/${{ matrix.preset }}/generated/*
            build/${{ matrix.preset }}/ctest-results.xml
            build/${{ matrix.preset }}/firmware-static-contract.json
            build/${{ matrix.preset }}/Testing/Temporary/*.log
          if-no-files-found: warn
          retention-days: 14

  candidate-release:
    name: Create Draft Release Candidate
    needs: [metadata, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      SOURCE_COMMIT: ${{ needs.metadata.outputs.commit }}
      RELEASE_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Download complete candidate asset set
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-nexus-*
          path: release
          merge-multiple: true
      - name: Verify assets and generate candidate notes
        run: |
          python3 scripts/ci/package_release.py verify-assets \
            --version "$RELEASE_VERSION" --source-commit "$SOURCE_COMMIT" \
            --expected nexus-linux-gcc=linux-gcc-release \
            --expected nexus-stm32f407-baremetal=stm32-armgcc-release \
            --expected nexus-stm32f407-freertos=stm32-armgcc-freertos-release \
            --expected nexus-stm32f407-qiming-baremetal=stm32-qiming-armgcc-baremetal-release \
            --expected nexus-stm32f407-qiming-freertos=stm32-qiming-armgcc-freertos-release \
            --expected nexus-stm32f407-sky-baremetal=stm32-sky-armgcc-baremetal-release \
            --expected nexus-stm32f407-sky-freertos=stm32-sky-armgcc-freertos-release \
            --expected nexus-gd32f470-liangshan-baremetal=gd32f470-armgcc-baremetal-release \
            --expected nexus-gd32f470-liangshan-freertos=gd32f470-armgcc-freertos-release
      - name: Create draft candidate after every build succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_options=(--draft --verify-tag)
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            release_options+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_VERSION" "${release_options[@]}" \
            --target "$SOURCE_COMMIT" --title "Nexus $RELEASE_VERSION candidate" \
            --notes-file release_notes.md release/*.zip release/SHA256SUMS
