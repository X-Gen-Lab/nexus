name: Source SDK Delivery and Software Preview

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact 40-character checkout commit; mismatches fail closed
        type: string
        required: true
      publish:
        description: Publish the policy-version software preview from verified bytes
        type: boolean
        default: false
      ci_run_id:
        description: Successful full CI run on main at expected_commit (last 24h)
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: nexus-source-sdk-release-${{ inputs.expected_commit }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false
      - name: Require the exact requested checkout before any qualification
        env:
          NEXUS_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/main) ;;
            *) echo 'Unauthorized delivery workflow ref' >&2; exit 1 ;;
          esac
          if [[ ! "$NEXUS_EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ || "$NEXUS_EXPECTED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo 'Qualification and publication require the exact workflow source commit' >&2
            exit 1
          fi
          python3 tools/release/delivery.py guard \
            --expected-commit "$NEXUS_EXPECTED_COMMIT" \
            --actual-commit "$(git rev-parse HEAD)"
      - name: Require fresh successful full CI before reusing its qualification
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEXUS_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          NEXUS_CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          [[ "$NEXUS_CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GH_REPO/actions/runs/$NEXUS_CI_RUN_ID" > "$RUNNER_TEMP/ci-run.json"
          attempt=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["run_attempt"])' "$RUNNER_TEMP/ci-run.json")
          gh api "repos/$GH_REPO/actions/runs/$NEXUS_CI_RUN_ID/attempts/$attempt/jobs?per_page=100" > "$RUNNER_TEMP/ci-jobs.json"
          python3 tools/release/delivery.py check-ci \
            --record "$RUNNER_TEMP/ci-run.json" --jobs "$RUNNER_TEMP/ci-jobs.json" \
            --expected-commit "$NEXUS_EXPECTED_COMMIT"
  platform:
    needs: guard
    if: ${{ !inputs.publish }}
    uses: ./.github/workflows/build-matrix.yml
  contracts:
    needs: guard
    if: ${{ !inputs.publish }}
    uses: ./.github/workflows/enterprise-tools.yml
  source-sdk:
    needs: [guard, platform, contracts]
    if: >-
      !cancelled() && needs.guard.result == 'success' &&
      (inputs.publish || (needs.platform.result == 'success' && needs.contracts.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0
          submodules: false
      - uses: ./.github/actions/setup-build
        with:
          preset: native-debug
          arm: 'true'
      - name: Prepare the complete locked source SDK dependency closure
        run: >-
          .venv/bin/python tools/dev/dependencies.py prepare --scope sdk
          --allow-network --report build/sdk-dependencies.json
      - name: Package only the clean checked-out source and locked dependencies
        run: >-
          .venv/bin/python cmake/package/package_source_sdk.py
          --source "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/nexus-source-sdk"
      - name: Verify the installed source and exported CMake package byte identities
        run: >-
          .venv/bin/python cmake/package/package_source_sdk.py
          --verify "$RUNNER_TEMP/nexus-source-sdk/share/nexus/src"
      - name: Execute strict consumers against this exact installed prefix
        run: >-
          .venv/bin/python cmake/package/verify_consumers.py
          --prefix "$RUNNER_TEMP/nexus-source-sdk"
          --output "$RUNNER_TEMP/nexus-sdk-consumers"
      - name: Preserve complete raw consumer evidence with the versioned builder
        env:
          NEXUS_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          git show "$GITHUB_SHA:tools/release/transport.py" > "$RUNNER_TEMP/nexus-consumer-transport.py"
          .venv/bin/python "$RUNNER_TEMP/nexus-consumer-transport.py" pack \
            --raw "$RUNNER_TEMP/nexus-sdk-consumers" \
            --output "$RUNNER_TEMP/nexus-sdk-consumer-transport" \
            --expected-commit "$NEXUS_EXPECTED_COMMIT"
      - name: Stage verified SDK and strict consumer bytes inside owned build paths
        env:
          NEXUS_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          .venv/bin/python tools/release/delivery.py stage \
            --source "$GITHUB_WORKSPACE" --prefix "$RUNNER_TEMP/nexus-source-sdk" \
            --consumers "$RUNNER_TEMP/nexus-sdk-consumer-transport" \
            --output "$GITHUB_WORKSPACE/build/delivery" \
            --expected-commit "$NEXUS_EXPECTED_COMMIT"
      - name: Bind the upload to observed execution identity
        if: always()
        uses: ./.github/actions/record-identity
        with:
          job: source-sdk
          result: ${{ job.status }}
          expected-commit: ${{ inputs.expected_commit }}
          output: build/job-identities/source-sdk
          require-dependencies: 'true'
          artifacts: |
            build/delivery/source-sdk/
            build/delivery/sdk-consumers/
            build/delivery/staging-copy.json
          tools: |
            python=python3
            cmake=cmake
            compiler=arm-none-eabi-gcc
      - name: Retain the verified source SDK
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-source-sdk-${{ inputs.expected_commit }}
          path: |
            build/delivery/source-sdk/
            build/delivery/sdk-consumers/
            build/delivery/staging-copy.json
            build/job-identities/source-sdk/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Attest the observed source SDK manifest
        id: provenance
        if: success()
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/job-identities/source-sdk/identity.json
      - name: Retain the actual attestation bundle
        if: success()
        env:
          NEXUS_ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          test -s "$NEXUS_ATTESTATION_BUNDLE"
          mkdir -p build/delivery/attestation
          cp -- "$NEXUS_ATTESTATION_BUNDLE" build/delivery/attestation/bundle.json
      - name: Bind the attestation upload to observed execution identity
        if: always()
        uses: ./.github/actions/record-identity
        with:
          job: source-sdk-attestation
          result: ${{ job.status }}
          expected-commit: ${{ inputs.expected_commit }}
          output: build/job-identities/source-sdk-attestation
          artifacts: build/delivery/attestation/
          tools: python=python3
      - name: Preserve the actual attestation and its job identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-source-sdk-attestation-${{ inputs.expected_commit }}
          path: |
            build/delivery/attestation/
            build/job-identities/source-sdk-attestation/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
      # Platform/tool jobs are reused only after exact full CI admission.
      # Physical HIL and production candidate qualification remain separate.

  publish:
    needs: [guard, source-sdk]
    if: ${{ !cancelled() && inputs.publish && needs.guard.result == 'success' && needs.source-sdk.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NEXUS_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      NEXUS_CI_RUN_ID: ${{ inputs.ci_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download this run's SDK and exact qualified CI documentation
        run: |
          [[ "$NEXUS_CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          mkdir -p "$RUNNER_TEMP/release-inputs"
          gh api "repos/$GH_REPO/actions/runs/$NEXUS_CI_RUN_ID" > "$RUNNER_TEMP/release-inputs/ci-run.json"
          attempt=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["run_attempt"])' "$RUNNER_TEMP/release-inputs/ci-run.json")
          gh api "repos/$GH_REPO/actions/runs/$NEXUS_CI_RUN_ID/attempts/$attempt/jobs?per_page=100" > "$RUNNER_TEMP/release-inputs/ci-jobs.json"
          gh run download "$GITHUB_RUN_ID" --name "nexus-source-sdk-$NEXUS_EXPECTED_COMMIT" --dir "$RUNNER_TEMP/release-inputs/sdk"
          gh run download "$GITHUB_RUN_ID" --name "nexus-source-sdk-attestation-$NEXUS_EXPECTED_COMMIT" --dir "$RUNNER_TEMP/release-inputs/attestation"
          gh run download "$NEXUS_CI_RUN_ID" --name "nexus-documentation-$NEXUS_EXPECTED_COMMIT" --dir "$RUNNER_TEMP/release-inputs/docs"
          gh run download "$NEXUS_CI_RUN_ID" --dir "$RUNNER_TEMP/release-inputs/ci-evidence"
      - name: Verify the actual GitHub source SDK attestation
        run: |
          gh attestation verify "$RUNNER_TEMP/release-inputs/sdk/job-identities/source-sdk/identity.json" \
            --bundle "$RUNNER_TEMP/release-inputs/attestation/delivery/attestation/bundle.json" \
            --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
            --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF"
      - name: Verify and assemble immutable release assets
        run: |
          python3 tools/release/delivery.py bundle \
            --inputs "$RUNNER_TEMP/release-inputs" --output "$RUNNER_TEMP/release-assets" \
            --expected-commit "$NEXUS_EXPECTED_COMMIT" --ci-run-id "$NEXUS_CI_RUN_ID" \
            --release-run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Disclose the separate source and versioned delivery workflow identities
        run: |
          git show "$GITHUB_SHA:tools/release/transport.py" > "$RUNNER_TEMP/nexus-consumer-transport.py"
          python3 "$RUNNER_TEMP/nexus-consumer-transport.py" attach \
            --source "$GITHUB_WORKSPACE" \
            --inputs "$RUNNER_TEMP/release-inputs" --output "$RUNNER_TEMP/release-assets" \
            --source-commit "$NEXUS_EXPECTED_COMMIT" --builder-commit "$GITHUB_SHA" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Publish only the complete verified asset set on the existing exact tag
        run: |
          python3 tools/release/delivery.py publish \
            --output "$RUNNER_TEMP/release-assets" --expected-commit "$NEXUS_EXPECTED_COMMIT" \
            --ci-run-id "$NEXUS_CI_RUN_ID" --repository "$GH_REPO"
