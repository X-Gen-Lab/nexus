name: Quality Checks
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-analysis:
    name: Required static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Initialize pinned maintained dependencies
        run: git submodule update --init --recursive ext/googletest ext/freertos vendors/arm/CMSIS_5 vendors/st/cmsis_device_f4 vendors/st/stm32f4xx_hal_driver
      - uses: ./.github/actions/setup-build
        with:
          os: ubuntu-latest
          preset: linux-clang-debug
      - name: Install analyzers
        run: sudo apt-get install -y clang-tidy-14 cppcheck
      - name: Configure actual compilation database
        run: cmake --preset linux-clang-debug
      - name: Test analyzer execution policy
        run: python3 -m unittest discover -s scripts/ci -p 'test_quality_tools.py' -v
      - name: Run required clang analyzer
        run: python3 scripts/ci/quality_tools.py tidy --build-dir build/linux-clang-debug --tool clang-tidy-14 --report build/quality/clang-tidy.txt
      - name: Run required cppcheck
        if: '!cancelled()'
        run: python3 scripts/ci/quality_tools.py cppcheck --build-dir build/linux-clang-debug --tool cppcheck --report build/quality/cppcheck.txt
      - name: Retain reports on success and failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: required-static-analysis
          path: build/quality/
          if-no-files-found: error
# MISRA qualification needs an agreed rule set and approved deviations.
# An empty stderr file does not establish compliance. Formatting/complexity
# remain engineering guidance; required analysis rejects findings/tool failures.
