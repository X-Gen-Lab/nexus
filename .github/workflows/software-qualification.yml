name: Nonpublishing Software Qualification

on:
  workflow_call:
    inputs:
      expected_commit:
        type: string
        required: true
      qualification_assembly:
        type: string
        required: true
      qualification_workload:
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: software-qualification-${{ github.sha }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NEXUS_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      NEXUS_WORKFLOW_SHA: ${{ github.workflow_sha }}
      NEXUS_QUALIFICATION_ASSEMBLY: ${{ inputs.qualification_assembly }}
      NEXUS_QUALIFICATION_WORKLOAD: ${{ inputs.qualification_workload }}
      Q: ${{ github.workspace }}/build/software-qualification
      PYTHONDONTWRITEBYTECODE: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      NEXUS_BUILD_JOBS: '1'
      DOCKER_BUILDKIT: '1'
    steps:
      - name: Reject a different workflow or requested source before checkout
        id: request
        run: |
          mkdir "$RUNNER_TEMP/nexus-qualification-early-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          exec > >(tee "$RUNNER_TEMP/nexus-qualification-early-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/request.raw") 2>&1
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / ('nexus-qualification-early-' +
                  os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          names = ('GITHUB_REPOSITORY', 'GITHUB_EVENT_NAME', 'GITHUB_REF',
                   'GITHUB_SHA', 'GITHUB_WORKFLOW_REF', 'NEXUS_WORKFLOW_SHA',
                   'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'NEXUS_EXPECTED_COMMIT')
          context = {name: os.environ.get(name, '') for name in names}
          (root / 'context.json').write_text(json.dumps(context, indent=2) + '\n')
          expected = context['NEXUS_EXPECTED_COMMIT']
          if (not re.fullmatch('[0-9a-f]{40}', expected) or
                  expected != context['GITHUB_SHA'] or
                  expected != context['NEXUS_WORKFLOW_SHA']):
              (root / 'identity-unavailable.json').write_text(json.dumps({
                  'identity_available': False, 'reason': 'request_workflow_sha_mismatch',
                  'qualified': False}) + '\n')
              raise SystemExit('Expected, context and workflow SHA must be identical')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Verify the actual clean checkout and explicit reproduction tuple
        id: source
        run: |
          exec > >(tee "$RUNNER_TEMP/nexus-qualification-early-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/source.raw") 2>&1
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path, PurePosixPath
          early = Path(os.environ['RUNNER_TEMP']) / ('nexus-qualification-early-' +
                  os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          try:
              root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
              def git(*args):
                  return subprocess.check_output(['git', '-C', str(root), *args], text=True).strip()
              expected = os.environ['NEXUS_EXPECTED_COMMIT']
              commit = git('rev-parse', 'HEAD')
              if commit != expected or git('status', '--porcelain', '--untracked-files=all'):
                  raise ValueError('Actual checkout must be exact and clean')
              raw = os.environ['NEXUS_QUALIFICATION_ASSEMBLY']
              relative = PurePosixPath(raw)
              if (relative.is_absolute() or str(relative) != raw or
                      '..' in relative.parts or '\\' in raw or
                      relative.parts[:3] != ('tools', 'configure', 'assemblies') or
                      relative.suffix != '.toml'):
                  raise ValueError('Canonical maintained assembly path required')
              selected = root / raw
              if any((root / Path(*relative.parts[:i])).is_symlink()
                     for i in range(1, len(relative.parts) + 1)):
                  raise ValueError('Assembly must not traverse symlinks')
              if not selected.is_file() or not selected.resolve().is_relative_to(root):
                  raise ValueError('Contained regular assembly required')
              git('ls-files', '--error-unmatch', '--', raw)
              workload = os.environ['NEXUS_QUALIFICATION_WORKLOAD']
              if workload not in ('empty', 'gpio', 'uart', 'spi'):
                  raise ValueError('Known explicit workload required')
              output = root / 'build/software-qualification'
              output.mkdir(parents=True, exist_ok=False)
              (output / 'source.json').write_text(json.dumps({
                  'commit': commit, 'tree': git('rev-parse', 'HEAD^{tree}'),
                  'assembly': raw, 'workload': workload,
                  'physical_status': 'not_executed'}, indent=2) + '\n')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
                  stream.write('validated=true\n')
          except (OSError, ValueError, subprocess.SubprocessError) as error:
              early.mkdir(parents=True, exist_ok=True)
              (early / 'identity-unavailable.json').write_text(json.dumps({
                  'identity_available': False, 'reason': str(error),
                  'qualified': False}) + '\n')
              raise SystemExit(str(error))
          PY
          python3 tools/release/delivery.py guard \
            --expected-commit "$NEXUS_EXPECTED_COMMIT" \
            --actual-commit "$(git rev-parse HEAD)"
      - name: Observe preparation resources without changing Docker admission
        id: resources
        run: |
          exec > >(tee "$Q/resources.raw") 2>&1
          uname -a
          df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          docker version
          docker buildx version
          docker info
          test -s /etc/ssl/certs/ca-certificates.crt
          python3 - <<'PY'
          import os, shutil
          if os.uname().machine != 'x86_64':
              raise SystemExit('Linux amd64 runner required')
          if min(shutil.disk_usage(os.environ[p]).free
                 for p in ('GITHUB_WORKSPACE', 'RUNNER_TEMP')) < 10 * 1024 ** 3:
              raise SystemExit('Runner planning headroom below 10 GiB')
          PY
      - uses: ./.github/actions/setup-build
        with:
          preset: native-debug
          arm: 'true'
      - name: Execute the complete clean installed SDK consumer boundary
        id: sdk
        run: |
          exec > >(tee "$Q/sdk.raw") 2>&1
          P="$RUNNER_TEMP/nexus-source-sdk"
          .venv/bin/python tools/dev/dependencies.py prepare --scope sdk \
            --allow-network --report "$Q/sdk-dependencies.json"
          .venv/bin/python cmake/package/package_source_sdk.py \
            --source "$GITHUB_WORKSPACE" --output "$P"
          .venv/bin/python cmake/package/package_source_sdk.py \
            --verify "$P/share/nexus/src"
          .venv/bin/python cmake/package/verify_consumers.py --prefix "$P" \
            --output "$RUNNER_TEMP/nexus-sdk-consumers" --parallel 1
          .venv/bin/python tools/release/transport.py pack \
            --raw "$RUNNER_TEMP/nexus-sdk-consumers" \
            --output "$RUNNER_TEMP/nexus-sdk-consumer-transport" \
            --expected-commit "$NEXUS_EXPECTED_COMMIT"
          .venv/bin/python tools/release/delivery.py stage \
            --source "$GITHUB_WORKSPACE" --prefix "$P" \
            --consumers "$RUNNER_TEMP/nexus-sdk-consumer-transport" \
            --output "$GITHUB_WORKSPACE/build/delivery" \
            --expected-commit "$NEXUS_EXPECTED_COMMIT"
      - name: Build and verify newly observed locked-recipe OCI bytes
        id: image
        run: |
          exec > >(tee "$Q/image.raw") 2>&1
          .venv/bin/python tools/evidence/recipe.py verify \
            --lock dependencies/build-recipe.lock.json \
            --requirements dependencies/python-tools-linux-cp312.txt \
            --dockerfile tools/dev/Dockerfile --report "$Q/recipe-inputs.json"
          context="$RUNNER_TEMP/nexus-oci-context"
          mkdir "$context"
          mkdir "$context/dependencies"
          cp -- dependencies/python-tools-linux-cp312.txt "$context/dependencies/"
          docker build --file "$GITHUB_WORKSPACE/tools/dev/Dockerfile" \
            --secret id=proxy_ca,src=/etc/ssl/certs/ca-certificates.crt \
            --iidfile "$RUNNER_TEMP/nexus-image-id" "$context"
          ACTUAL_IMAGE_ID=$(python3 - <<'PY'
          import os, re
          from pathlib import Path
          raw = (Path(os.environ['RUNNER_TEMP']) / 'nexus-image-id').read_text()
          if not re.fullmatch('sha256:[0-9a-f]{64}\\n?', raw):
              raise SystemExit('One exact actual image config ID required')
          print(raw.rstrip('\n'))
          PY
          )
          .venv/bin/python tools/evidence/container.py seal --image "$ACTUAL_IMAGE_ID" \
            --dockerfile "$GITHUB_WORKSPACE/tools/dev/Dockerfile" --output "$Q/observed-oci"
          .venv/bin/python tools/evidence/container.py verify --lock "$Q/observed-oci/environment.json"
          .venv/bin/python tools/evidence/container.py load --lock "$Q/observed-oci/environment.json"
          .venv/bin/python tools/evidence/environment.py export --kind oci \
            --source "$Q/observed-oci" --store "$Q/environment-store" --report "$Q/oci-envelope.json"
          .venv/bin/python tools/evidence/environment.py export --kind toolchain \
            --source "$RUNNER_TEMP/nexus-arm-toolchain" \
            --store "$Q/environment-store" --report "$Q/toolchain-envelope.json"
      - name: Execute two fresh offline builds of the exact declared tuple
        id: reproduce
        run: |
          E="$RUNNER_TEMP/nexus-reproduction-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          exec > >(tee "$Q/reproduce.raw") 2>&1
          mkdir "$E"
          .venv/bin/python tools/evidence/reproduce.py --prepare-spec \
            --spec "$Q/spec.json" --source "$GITHUB_WORKSPACE" \
            --source-sdk "$RUNNER_TEMP/nexus-source-sdk/share/nexus/src/.nexus-source-sdk.json" \
            --assembly "$GITHUB_WORKSPACE/$NEXUS_QUALIFICATION_ASSEMBLY" \
            --workload "$NEXUS_QUALIFICATION_WORKLOAD" \
            --environment "$Q/observed-oci/environment.json" \
            --toolchain "$RUNNER_TEMP/nexus-arm-toolchain"
          .venv/bin/python tools/evidence/reproduce.py --spec "$Q/spec.json" --report "$E/reproduction.json"
      - name: Preserve available setup and failed partial output without qualifying it
        id: collect
        if: always()
        env:
          NEXUS_CHECKOUT_VALIDATED: ${{ steps.source.outputs.validated }}
          NEXUS_JOB_RESULT: ${{ job.status }}
        run: |
          E="$RUNNER_TEMP/nexus-reproduction-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          Q="$GITHUB_WORKSPACE/build/software-qualification"
          mkdir -p "$Q/setup"
          if test -d "$RUNNER_TEMP/nexus-qualification-early-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"; then
            cp -p -- "$RUNNER_TEMP/nexus-qualification-early-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/"* "$Q/setup/"
          fi
          exec > >(tee "$Q/collect.raw") 2>&1
          if test -e "$E" || test -L "$E"; then
            .venv/bin/python tools/evidence/store.py export \
              --source "$E" --store "$Q/reproduction-store" \
              --report "$Q/reproduction-package.json"
          else
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          output = Path(os.environ['GITHUB_WORKSPACE']) / 'build/software-qualification'
          (output / 'reproduction-package.json').write_text(json.dumps({
              'status': 'not_executed', 'archive_created': False,
              'reason': 'execution_directory_not_created'}) + '\n')
          if os.environ['NEXUS_JOB_RESULT'] == 'success':
              raise SystemExit('Successful qualification requires an execution archive')
          PY
          fi
          if [[ "$NEXUS_CHECKOUT_VALIDATED" == true && "$NEXUS_JOB_RESULT" != success && -x .venv/bin/python ]]; then
            for name in nexus-source-sdk nexus-sdk-consumers nexus-sdk-consumer-transport; do
              if test -d "$RUNNER_TEMP/$name"; then
                .venv/bin/python tools/evidence/store.py export \
                  --source "$RUNNER_TEMP/$name" --store "$Q/partial-store" \
                  --report "$Q/partial-$name.json"
              fi
            done
          fi
      - name: Check whether exact-checkout job identity is actually available
        id: readiness
        if: always()
        env:
          NEXUS_CHECKOUT_VALIDATED: ${{ steps.source.outputs.validated }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          output = Path(os.environ['GITHUB_WORKSPACE']) / 'build/software-qualification/setup'
          output.mkdir(parents=True, exist_ok=True)
          if os.environ['NEXUS_CHECKOUT_VALIDATED'] != 'true':
              path = output / 'identity-unavailable.json'
              if not path.exists():
                  path.write_text(json.dumps({'identity_available': False,
                      'reason': 'checkout_not_validated', 'qualified': False}) + '\n')
          else:
              result = subprocess.run(['python3', '-c', 'import tools.maintenance.job_identity'])
              if result.returncode:
                  (output / 'identity-unavailable.json').write_text(json.dumps({
                      'identity_available': False, 'reason': 'identity_tool_unavailable',
                      'qualified': False}) + '\n')
                  raise SystemExit(result.returncode)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
                  stream.write('ready=true\n')
          PY
      - name: Derive original role selectors from the maintained authority
        id: transport_plan
        if: always() && steps.readiness.outputs.ready == 'true'
        run: >-
          python3 tools/evidence/qualification_transfer.py plan
          --github-output "$GITHUB_OUTPUT"
      - name: Bind available artifacts to the actual completed or failed job
        id: identity
        if: always() && steps.readiness.outputs.ready == 'true'
        uses: ./.github/actions/record-identity
        with:
          job: software-qualification
          result: ${{ job.status }}
          expected-commit: ${{ inputs.expected_commit }}
          output: ${{ steps.transport_plan.outputs.identity_output }}
          require-dependencies: 'true'
          artifacts: ${{ steps.transport_plan.outputs.identity_inputs }}
          tools: |
            python=python3
            cmake=cmake
            compiler=arm-none-eabi-gcc
            docker=docker
      - name: Prepare complete lossless evidence volumes
        id: prepare
        if: always() && steps.identity.outcome == 'success'
        run: >-
          .venv/bin/python tools/evidence/qualification_transfer.py prepare
          --root "$GITHUB_WORKSPACE"
          --output "$GITHUB_WORKSPACE/build/qualification-transfer"
          --commit "$NEXUS_EXPECTED_COMMIT"
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          --github-output "$GITHUB_OUTPUT"
      - name: Retain independent evidence volume 0
        id: part0
        if: always() && steps.prepare.outcome == 'success' && fromJSON(steps.prepare.outputs.count) > 0
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-part-000
          path: build/qualification-transfer/parts/part-000
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain independent evidence volume 1
        id: part1
        if: always() && steps.prepare.outcome == 'success' && fromJSON(steps.prepare.outputs.count) > 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-part-001
          path: build/qualification-transfer/parts/part-001
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain independent evidence volume 2
        id: part2
        if: always() && steps.prepare.outcome == 'success' && fromJSON(steps.prepare.outputs.count) > 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-part-002
          path: build/qualification-transfer/parts/part-002
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain independent evidence volume 3
        id: part3
        if: always() && steps.prepare.outcome == 'success' && fromJSON(steps.prepare.outputs.count) > 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-part-003
          path: build/qualification-transfer/parts/part-003
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain independent evidence volume 4
        id: part4
        if: always() && steps.prepare.outcome == 'success' && fromJSON(steps.prepare.outputs.count) > 4
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-part-004
          path: build/qualification-transfer/parts/part-004
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain independent evidence volume 5
        id: part5
        if: always() && steps.prepare.outcome == 'success' && fromJSON(steps.prepare.outputs.count) > 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-part-005
          path: build/qualification-transfer/parts/part-005
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain independent evidence volume 6
        id: part6
        if: always() && steps.prepare.outcome == 'success' && fromJSON(steps.prepare.outputs.count) > 6
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-part-006
          path: build/qualification-transfer/parts/part-006
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain independent evidence volume 7
        id: part7
        if: always() && steps.prepare.outcome == 'success' && fromJSON(steps.prepare.outputs.count) > 7
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-part-007
          path: build/qualification-transfer/parts/part-007
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Record actual volume upload outcomes without qualification
        id: transfer_result
        if: always() && steps.prepare.outcome == 'success'
        env:
          NEXUS_UPLOAD_STEPS: ${{ toJSON(steps) }}
        run: >-
          .venv/bin/python tools/evidence/qualification_transfer.py finish
          --output "$GITHUB_WORKSPACE/build/qualification-transfer"
      - name: Retain the independently downloadable core index last
        id: core
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-core
          path: build/qualification-transfer/core/
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain exact software scopes or explicitly unqualified failure evidence
        id: upload
        if: always() && steps.prepare.outcome != 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: software-qualification-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/software-qualification/
            build/delivery/
            build/job-identities/software-qualification/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      # Scope is SDK consumption and this offline tuple. No MCU/HIL or candidate claim.
