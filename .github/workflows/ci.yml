name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'hal/**'
              - 'osal/**'
              - 'framework/**'
              - 'platforms/**'
              - 'applications/**'
              - 'tests/**'
              - '**/CMakeLists.txt'
              - 'cmake/**'
              - 'CMake*Presets.json'
              - 'scripts/**'
              - '**/Kconfig*'
              - '**/Kconfig*/**'
              - '.config'
              - '.config.*'
              - '**/.config'
              - '**/.config.*'
              - 'configs/**'
              - '**/*defconfig'
              - 'dependencies/**'
              - 'deps/**'
              - 'third_party/**'
              - 'ext/**'
              - 'nexus.lock'
              - '.gitmodules'
              - '**/requirements*.txt'
              - '**/pyproject.toml'
              - '**/poetry.lock'
              - '**/uv.lock'
              - '.clang-format*'
              - '.clang-tidy*'
              - '.clangd'
            docs:
              - 'docs/**'
              - '**.md'
              - 'Doxyfile'
              - 'Doxyfile.*'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/dependabot.yml'
              - '.github/dependabot.yaml'

  build-test:
    name: Build & Test
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-matrix.yml
    secrets: inherit

  code-quality:
    name: Code Quality
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/quality-checks.yml

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.code == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/docs-build.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write

  status-check:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [changes, build-test, code-quality, docs]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Test CI gate policy
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Check required results
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci/check_required_jobs.py
