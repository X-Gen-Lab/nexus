name: CI

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [ main, develop, 'codex/**', 'feat/**' ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify actual Git changes
        id: filter
        env:
          NEXUS_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          NEXUS_CHANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/dev/change_paths.py --github-output "$GITHUB_OUTPUT"

  build-test:
    name: Build & Test
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-matrix.yml
    secrets: inherit

  code-quality:
    name: Code Quality
    needs: changes
    uses: ./.github/workflows/quality-checks.yml
    with:
      run_static_analysis: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  tool-contracts:
    name: Tool Contracts
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/enterprise-tools.yml

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.code == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/docs-build.yml
    permissions:
      contents: read

  status-check:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [changes, build-test, code-quality, tool-contracts, docs]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check required results
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci/check_required_jobs.py
