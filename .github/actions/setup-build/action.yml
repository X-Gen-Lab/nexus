name: Setup Nexus Tools
description: Install pinned CLI tools and the explicitly selected compiler

inputs:
  preset:
    description: CMake preset used by this job
    required: true
  arm:
    description: Install the hash-verified ARM GNU distribution
    default: 'false'
  os:
    description: Caller metadata; execution uses the runner OS
    default: ubuntu-24.04

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
    - name: Install the locked local build and commit tools
      shell: bash
      run: |
        python scripts/setup/install_dev_tools.py --skip-hooks
        .venv/bin/python -m pip install -r requirements.txt
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
    - name: Initialize selected vendor and scheduler sources
      shell: bash
      run: |
        git submodule update --init --recursive ext/freertos vendors/arm/CMSIS_5 vendors/st/cmsis_device_f4
    - name: Install the locked ARM compiler
      if: inputs.arm == 'true'
      shell: bash
      run: |
        .venv/bin/python scripts/ci/install_arm_toolchain.py --install-dir "$RUNNER_TEMP/nexus-arm-toolchain"
        echo "$RUNNER_TEMP/nexus-arm-toolchain/bin" >> "$GITHUB_PATH"
    # Runner compiler checks provide fast feedback. Formal reproducibility
    # uses the measured OCI environment, not the runner's mutable host packages.
